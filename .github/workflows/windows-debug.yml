name: Windows debug
on:
  push:
    branches: ['debug/**']
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Path diagnostics
        run: bun run scripts/debug/win-paths.ts
      - name: Connector test
        run: bun test --timeout 30000 tests/unit/agent-plugin-mcp.test.ts
