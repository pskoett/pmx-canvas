.canvas-node .node-resize-handle::after {
  content: "";
  position: absolute;
  bottom: 3px;
  right: 3px;
  width: 8px;
  height: 8px;
  border-right: 2px solid var(--c-line);
  border-bottom: 2px solid var(--c-line);
  opacity: 0.5;
}

.canvas-node:hover .node-resize-handle::after {
  border-color: var(--c-muted);
  opacity: 1;
}

html.is-node-resizing,
html.is-node-resizing * {
  cursor: nwse-resize !important;
}

html.is-node-resizing .canvas-node {
  transition: box-shadow 0.15s ease !important;
}

html.is-node-dragging .attention-field-layer {
  visibility: hidden;
}

html.is-node-dragging,
html.is-node-dragging *,
html.is-canvas-panning,
html.is-canvas-panning * {
  cursor: grabbing !important;
  user-select: none !important;
  -webkit-user-select: none !important;
}

html.is-node-dragging iframe,
html.is-node-dragging .ext-app-preview-catcher {
  pointer-events: none !important;
}

html.is-node-resizing iframe,
html.is-node-resizing .ext-app-preview-catcher {
  pointer-events: none !important;
}

/* Pinned node indicator */
.canvas-node.pinned {
  border-style: dashed;
}

.canvas-node .pin-indicator {
  color: var(--c-accent);
  font-size: calc(11px * var(--node-chrome-scale, 1));
  opacity: 0.6;
}

/* Rename input inside title bar */
.canvas-node .node-title-input {
  flex: 1;
  min-width: 0;
  font-size: calc(12px * var(--node-chrome-scale, 1));
  font-weight: 600;
  color: var(--c-text);
  background: var(--c-surface-hover);
  border: 1px solid var(--c-accent);
  border-radius: calc(3px * var(--node-chrome-scale, 1));
  padding: calc(1px * var(--node-chrome-scale, 1)) calc(6px * var(--node-chrome-scale, 1));
  outline: none;
  font-family: inherit;
}

/* Context menu */
.context-menu {
  background: var(--c-panel-glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--c-line);
  border-radius: var(--radius-sm);
  padding: 4px 0;
  min-width: 220px;
  box-shadow: 0 8px 32px var(--c-shadow-heavy);
}

.context-menu-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 6px 12px;
  background: none;
  border: none;
  color: var(--c-text);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  text-align: left;
}

.context-menu-item:hover {
  background: var(--c-accent-10);
  color: var(--c-accent);
}

.context-menu-item.is-danger .context-menu-label {
  color: var(--c-danger, #e5484d);
}

.context-menu-shortcut {
  color: var(--c-muted);
  font-size: 10px;
  margin-left: 16px;
}

.context-menu-separator {
  height: 1px;
  background: var(--c-line);
  margin: 4px 0;
}

.context-menu-custom {
  padding: 0;
}

.context-menu-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 12px 10px;
}

.context-menu-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.context-menu-section-label {
  color: var(--c-muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.context-menu-reset {
  background: none;
  border: none;
  color: var(--c-muted);
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  padding: 0;
}

.context-menu-reset:hover {
  color: var(--c-accent);
}

.context-menu-color-grid {
  display: grid;
  gap: 6px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.context-menu-color-swatch {
  align-items: center;
  background: var(--c-surface-subtle);
  border: 1px solid var(--c-line);
  border-radius: var(--radius-sm);
  color: var(--c-text);
  cursor: pointer;
  display: inline-flex;
  font: inherit;
  font-size: 11px;
  gap: 8px;
  justify-content: flex-start;
  padding: 6px 8px;
  width: 100%;
}

.context-menu-color-swatch:hover {
  background: var(--c-accent-8);
  border-color: var(--c-accent-30);
}

.context-menu-color-swatch.active {
  border-color: var(--swatch-color, var(--c-accent));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--swatch-color, var(--c-accent)) 45%, transparent);
}

.context-menu-color-dot {
  background: var(--swatch-color);
  border-radius: 999px;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--swatch-color) 60%, #000 40%);
  flex: 0 0 auto;
  height: 10px;
  width: 10px;
}

.context-menu-color-custom {
  align-items: center;
  color: var(--c-muted);
  display: flex;
  font-size: 11px;
  justify-content: space-between;
  gap: 12px;
}

.context-menu-color-input {
  appearance: none;
  background: none;
  border: none;
  cursor: pointer;
  height: 26px;
  padding: 0;
  width: 42px;
}

.context-menu-color-input::-webkit-color-swatch-wrapper {
  padding: 0;
}

.context-menu-color-input::-webkit-color-swatch {
  border: 1px solid var(--c-line);
  border-radius: 999px;
}

/* Edge labels — --edge-chrome-scale is set on the edge <svg> so labels keep a
   constant screen size while zoomed out (see edgeChromeScale in EdgeLayer). */
.edge-label {
  font-family: var(--font);
  font-size: calc(11px * var(--edge-label-scale, 1));
  pointer-events: none;
  user-select: none;
}

.edge-label-bg {
  fill: var(--c-panel-glass);
  stroke: var(--c-line);
  stroke-width: calc(0.5 * var(--edge-label-scale, 1));
}

/* Trace nodes — compact pills for agent tool/subagent visualization */
.canvas-node.trace-node {
  border-radius: 28px;
  min-height: 0;
}

.canvas-node.trace-node .node-titlebar {
  display: none;
}

.canvas-node.trace-node .node-resize-handle {
  display: none;
}

.canvas-node.trace-node .node-body {
  padding: 0;
  display: flex;
  align-items: center;
}

.canvas-node.trace-node.trace-running {
  border-color: var(--c-accent);
  animation: trace-pulse 2s ease-in-out infinite;
}

@keyframes trace-pulse {
  0%,
  100% {
    box-shadow: 0 0 0 0 var(--c-accent-30);
  }
  50% {
    box-shadow: 0 0 0 4px var(--c-accent-15);
  }
}

/* Diff nodes — unified diff viewer with per-file sections */
.diff-node {
  display: flex;
  flex-direction: column;
  gap: 10px;
  height: 100%;
  overflow: auto;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--c-text);
}

.diff-node.diff-node-empty {
  align-items: center;
  justify-content: center;
  color: var(--c-muted);
}

.diff-node .diff-file {
  border: 1px solid var(--c-line);
  border-radius: 6px;
  overflow: hidden;
  flex-shrink: 0;
}

.diff-node .diff-file-header {
  padding: 4px 8px;
  background: var(--c-panel-overlay);
  border-bottom: 1px solid var(--c-line);
  color: var(--c-text-soft);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.diff-node .diff-lines {
  margin: 0;
  padding: 4px 0;
  overflow-x: auto;
  font-family: inherit;
  font-size: inherit;
  line-height: 1.5;
}

.diff-node .diff-lines > div {
  padding: 0 8px;
  white-space: pre;
}

.diff-node .diff-hunk {
  color: var(--c-muted);
}

.diff-node .diff-line-add {
  color: var(--c-ok);
  background: var(--c-ok-10);
}

.diff-node .diff-line-remove {
  color: var(--c-danger);
  background: var(--c-danger-12);
}

.diff-node .diff-line-context {
  color: var(--c-text-soft);
}

/* File nodes — delimited-data tables and non-text placeholders */
.file-table-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

.file-node-notice {
  flex-shrink: 0;
  padding: 4px 10px;
  color: var(--c-muted);
  font-size: 10px;
}

/* Own scroll port so a wide CSV scrolls inside the node instead of blowing out
   the layout — and so the sticky header row has something to stick to. */
.file-table-wrap {
  flex: 1;
  min-height: 0;
  overflow: auto;
}

/* The shell/wrap prefix is load-bearing: these rules must out-specify the markdown
   table styles (`.canvas-node .node-body table` / `th` / `td`), whose 0.5em
   margin and translucent header background break the sticky header. Borders are
   separate, not collapsed — collapsed borders belong to the table element, so
   the header leaks the rows scrolling beneath it. */
.file-table-shell .file-table-wrap .file-table {
  margin: 0;
  border-collapse: separate;
  border-spacing: 0;
  width: max-content;
  min-width: 100%;
  font-family: var(--mono);
  color: var(--c-text);
}

.file-table-shell .file-table-wrap .file-table th,
.file-table-shell .file-table-wrap .file-table td {
  max-width: 320px;
  padding: 3px 8px;
  border: none;
  border-right: 1px solid var(--c-line);
  border-bottom: 1px solid var(--c-line);
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.file-table-shell .file-table-wrap .file-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  /* Opaque in every theme — rows must not bleed through while scrolling. */
  background: var(--c-panel);
  color: var(--c-text-soft);
  font-weight: 600;
}

.file-table-shell .file-table-wrap .file-table tbody tr:nth-child(even) {
  background: var(--c-surface-subtle);
}

.file-node-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 100%;
  padding: 16px;
  color: var(--c-muted);
  text-align: center;
}

.file-node-placeholder-name {
  color: var(--c-text-soft);
  word-break: break-all;
}

.file-node-link {
  color: var(--c-accent);
}

/* MCP app iframe */
.mcp-app-frame-stack {
  position: relative;
  flex: 1;
  min-width: 0;
  min-height: 0;
  background: var(--c-panel-soft);
  overflow: hidden;
  border-radius: 0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px);
}

.mcp-app-frame-stack:has(.html-node-frame) {
  width: 100%;
  height: 100%;
  min-height: 300px;
  background: var(--c-bg);
  border-radius: 6px;
}

.mcp-app-frame-stack:has(.html-node-frame-presentation) {
  min-height: 0;
  border-radius: 0;
}

.mcp-app-frame-stack:has(.html-node-frame-expanded) {
  min-height: 70vh;
}

.mcp-app-frame {
  width: 100%;
  height: 100%;
  border: none;
  background: var(--c-panel-soft);
  border-radius: 0 0 calc(var(--radius) - 1px) calc(var(--radius) - 1px);
}

/* Promote canvas iframes to their own GPU compositing layer. An iframe embedded
   in the zoom/pan-transformed canvas — especially near the heavy backdrop-filter
   blur used across the chrome and behind group frames — can intermittently paint
   blank until a resize/zoom forces a repaint (reported for grouped HTML nodes;
   the same class of compositor glitch as the earlier Excalidraw flicker). A no-op
   3D transform forces a stable layer so the iframe keeps painting through
   surrounding layout/stacking changes. */
.mcp-app-frame,
.html-node-frame {
  transform: translateZ(0);
  backface-visibility: hidden;
}

/* ── Prompt nodes ──────────────────────────────────────────── */
.canvas-node:has(.prompt-node-inner) {
  border-color: var(--c-accent-30);
}

.canvas-node:has(.prompt-node-inner) .node-type-badge {
  background: var(--c-accent-15);
  color: var(--c-accent);
}

/* ── Response nodes ────────────────────────────────────────── */
.canvas-node:has(.response-node-inner) {
  border-color: var(--c-ok-25);
}

.canvas-node:has(.response-node-inner) .node-type-badge {
  background: var(--c-ok-12);
  color: var(--c-ok);
}

/* Streaming pulse animation for response nodes */
@keyframes response-stream-pulse {
  0%,
  100% {
    opacity: 0.3;
    transform: translateX(-100%);
  }
  50% {
    opacity: 1;
    transform: translateX(100%);
  }
}

/* ── Multi-node selection (item 13: outline, corner handles, soft glow) ── */
.canvas-node.selected {
  border-color: var(--c-accent);
  box-shadow: 0 0 0 1px var(--c-accent), 0 0 0 4px color-mix(in srgb, var(--c-accent) 10%, transparent);
}
.node-selection-handle {
  position: absolute;
  width: 7px;
  height: 7px;
  background: var(--c-bg);
  border: 1.5px solid var(--c-accent);
  border-radius: 2px;
  pointer-events: none;
  z-index: 3;
}
.node-selection-handle.is-tl {
  left: -4px;
  top: -4px;
}
.node-selection-handle.is-tr {
  right: -4px;
  top: -4px;
}
.node-selection-handle.is-bl {
  left: -4px;
  bottom: -4px;
}
.node-selection-handle.is-br {
  right: -4px;
  bottom: -4px;
}

/* Lasso rectangle overlay */
.lasso-rect {
  background: var(--c-accent-8);
  border: 1px solid var(--c-accent);
  border-radius: 2px;
  z-index: 9998;
}

.annotation-layer {
  position: absolute;
  inset: 0;
  width: 1px;
  height: 1px;
  overflow: visible;
  pointer-events: none;
  z-index: 9000;
}

.annotation-capture-layer {
  position: absolute;
  inset: 0;
  z-index: 9996;
  pointer-events: auto;
  background: color-mix(in srgb, var(--c-accent) 5%, transparent);
}

.annotation-capture-layer.erasing {
  background: color-mix(in srgb, var(--c-danger) 6%, transparent);
}

.annotation-capture-layer.text {
  background: color-mix(in srgb, var(--c-annotation) 4%, transparent);
}

.annotation-text-input {
  position: absolute;
  z-index: 9997;
  min-width: 120px;
  max-width: min(560px, calc(100% - 24px));
  padding: 2px 4px;
  border: 1px solid var(--c-annotation);
  border-radius: 4px;
  background: color-mix(in srgb, var(--c-bg) 72%, transparent);
  color: var(--c-annotation);
  font-family: var(--font);
  font-weight: 700;
  line-height: 1.15;
  outline: none;
}

/* ── Drop Zone (file drag-and-drop) ─────────────────────────── */
.drop-zone-overlay {
  position: absolute;
  inset: 0;
  z-index: 9997;
  pointer-events: none;
  border: 2px dashed var(--c-accent);
  border-radius: 8px;
  background: var(--c-accent-8);
  animation: drop-zone-pulse 1.5s ease-in-out infinite;
}

@keyframes drop-zone-pulse {
  0%, 100% { background: var(--c-accent-8); }
  50% { background: var(--c-accent-12); }
}

.drop-zone-indicator {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 20px 32px;
  background: var(--c-panel-glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--c-accent-30);
  border-radius: 12px;
  box-shadow: 0 4px 24px var(--c-shadow), 0 0 24px var(--c-glow-accent);
}

.drop-zone-icon {
  font-size: 28px;
  font-weight: 300;
  color: var(--c-accent);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px dashed var(--c-accent-40);
  border-radius: 50%;
}

.drop-zone-label {
  font-size: 13px;
  color: var(--c-text-soft);
  white-space: nowrap;
}

/* ── Snap Alignment Guides ──────────────────────────────────── */
.snap-guide-line {
  stroke: var(--c-accent);
  stroke-width: 1;
  stroke-dasharray: 4 3;
  opacity: 0.7;
}

.snap-guides-svg {
  z-index: 9999;
}

/* In-canvas text prompt (window.prompt replacement — embedded panes no-op it). */
.text-prompt-backdrop {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 18vh;
  background: color-mix(in srgb, var(--c-bg) 42%, transparent);
  z-index: 10015;
}
.text-prompt {
  width: min(440px, calc(100% - 48px));
  padding: 14px;
  background: var(--c-panel);
  border: 1px solid var(--c-line);
  border-radius: 12px;
  box-shadow: 0 18px 60px var(--c-shadow-heavy);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.text-prompt-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text);
}
.text-prompt-input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  background: var(--c-bg);
  color: var(--c-text);
  font: 13px/1.4 var(--mono);
}
.text-prompt-input:focus {
  outline: none;
  border-color: var(--c-accent);
}
.text-prompt-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.text-prompt-cancel,
.text-prompt-confirm {
  min-height: 36px;
  padding: 8px 14px;
  border-radius: 7px;
  border: 1px solid color-mix(in srgb, var(--c-line) 65%, var(--c-muted));
  background: var(--c-panel-overlay);
  color: var(--c-text);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
}
.text-prompt-cancel:hover {
  background: var(--c-accent-10);
  border-color: var(--c-muted);
}
.text-prompt-cancel:focus-visible,
.text-prompt-confirm:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
}
.text-prompt-confirm {
  background: var(--c-accent);
  border-color: var(--c-accent);
  color: var(--c-bg);
  font-weight: 600;
}

.feedback-backdrop {
  position: fixed;
  padding: 24px 0;
  align-items: center;
}
.feedback-dialog {
  width: min(480px, calc(100% - 32px));
  max-height: calc(100dvh - 48px);
  overflow-y: auto;
  color: var(--c-text);
}
.feedback-dialog label,
.feedback-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12px;
}
.feedback-note {
  margin: 0;
  color: var(--c-muted);
  font-size: 12px;
  line-height: 1.5;
}
.feedback-dialog textarea {
  resize: vertical;
  min-height: 100px;
}
.feedback-dialog button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Selection action bar — floating bottom-center of the canvas region
   (rail-chrome-v2 phase 7, item 13). */
/* In a session the command bar owns the bottom-center slot — lift the
   selection bar clear of it (composer + chips row); on the quiet board the
   pin bar does, so lift past that instead. */
[data-session-active='true'] .selection-bar {
  bottom: 124px;
}
.selection-bar.is-above-pin-bar {
  bottom: 70px;
}
.selection-bar {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 6px 8px;
  background: color-mix(in srgb, var(--c-panel) 97%, transparent);
  backdrop-filter: blur(12px);
  border: 1px solid var(--c-line);
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  z-index: 66;
  white-space: nowrap;
}
.selection-bar-count {
  padding: 0 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--c-accent);
}
.selection-bar-sep {
  width: 1px;
  height: 18px;
  margin: 0 4px;
  background: var(--c-line);
}
.selection-bar-icon,
.selection-bar-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--c-muted);
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
}
.selection-bar-icon {
  width: 28px;
  font-size: 14px;
}
.selection-bar-action {
  padding: 0 9px;
}
.selection-bar-icon:hover,
.selection-bar-action:hover {
  background: color-mix(in srgb, var(--c-text) 6%, transparent);
  color: var(--c-text);
}
.selection-bar-icon:disabled {
  opacity: 0.35;
  cursor: default;
}
.selection-bar-action.is-pin:hover {
  background: color-mix(in srgb, var(--c-warn) 10%, transparent);
  color: var(--c-warn);
}
.selection-bar-icon.is-danger:hover {
  background: color-mix(in srgb, var(--c-danger) 12%, transparent);
  color: var(--c-danger);
}

/* ── Context-pinned nodes — amber glow ───────────────────────── */
.canvas-node.context-pinned {
  border-color: var(--c-warn-60);
  box-shadow: 0 0 0 2px var(--c-warn), 0 0 8px var(--c-warn-30);
}

.canvas-node.context-pinned .node-type-badge {
  background: var(--c-warn-15);
  color: var(--c-warn);
}

:root[data-theme="light"] .canvas-node.context-pinned {
  border-color: #4BBCFF;
  box-shadow: 0 0 0 2px #4BBCFF, 0 0 12px rgba(75, 188, 255, 0.28);
}

:root[data-theme="light"] .canvas-node.context-pinned .node-type-badge {
  background: rgba(75, 188, 255, 0.14);
  color: #1588CE;
}

/* ── Attention layer — human-facing semantic feedback ───────── */
.canvas-node.attention-focus-primary {
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--c-warn) 72%, transparent),
    0 12px 34px color-mix(in srgb, var(--c-warn) 18%, transparent),
    inset 0 0 0 1px color-mix(in srgb, var(--c-warn) 28%, transparent);
}

.canvas-node.attention-focus-primary .node-titlebar {
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--c-warn) 12%, transparent), transparent 68%),
    var(--c-panel-soft);
}

:root[data-theme="light"] .canvas-node.attention-focus-primary {
  box-shadow:
    0 0 0 1px rgba(75, 188, 255, 0.72),
    0 12px 34px rgba(75, 188, 255, 0.2),
    inset 0 0 0 1px rgba(75, 188, 255, 0.18);
}

:root[data-theme="light"] .canvas-node.attention-focus-primary .node-titlebar {
  background:
    linear-gradient(90deg, rgba(75, 188, 255, 0.14), transparent 68%),
    var(--c-panel-soft);
}

.canvas-node.attention-focus-secondary {
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--c-warn) 30%, transparent),
    0 8px 24px color-mix(in srgb, var(--c-warn) 10%, transparent);
}

.canvas-node.attention-focus-secondary .node-type-badge {
  background: color-mix(in srgb, var(--c-warn) 10%, transparent);
  color: color-mix(in srgb, var(--c-warn) 88%, var(--c-text) 12%);
}

:root[data-theme="light"] .canvas-node.attention-focus-secondary {
  box-shadow:
    0 0 0 1px rgba(75, 188, 255, 0.32),
    0 8px 24px rgba(75, 188, 255, 0.12);
}

:root[data-theme="light"] .canvas-node.attention-focus-secondary .node-type-badge {
  background: rgba(75, 188, 255, 0.12);
  color: #1588CE;
}

.canvas-node.attention-pulse {
  animation: attention-node-pulse 0.9s ease;
}

:root[data-theme="light"] .canvas-node.attention-pulse {
  animation-name: attention-node-pulse-light;
}

@keyframes attention-node-pulse {
  0% {
    transform: translateZ(0) scale(1);
    box-shadow:
      0 0 0 0 color-mix(in srgb, var(--c-warn) 0%, transparent),
      0 4px 24px var(--c-shadow);
  }
  38% {
    transform: translateZ(0) scale(1.012);
    box-shadow:
      0 0 0 3px color-mix(in srgb, var(--c-warn) 35%, transparent),
      0 16px 34px color-mix(in srgb, var(--c-warn) 16%, transparent);
  }
  100% {
    transform: translateZ(0) scale(1);
  }
}

@keyframes attention-node-pulse-light {
  0% {
    transform: translateZ(0) scale(1);
    box-shadow:
      0 0 0 0 rgba(75, 188, 255, 0),
      0 4px 24px var(--c-shadow);
  }
  38% {
    transform: translateZ(0) scale(1.012);
    box-shadow:
      0 0 0 3px rgba(75, 188, 255, 0.32),
      0 16px 34px rgba(75, 188, 255, 0.18);
  }
  100% {
    transform: translateZ(0) scale(1);
  }
}

.attention-field-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.attention-field-region,
.attention-field-node {
  position: absolute;
  pointer-events: none;
}

.attention-field-region {
  background:
    radial-gradient(circle at 25% 30%, color-mix(in srgb, var(--c-warn) 16%, transparent), transparent 62%),
    linear-gradient(135deg, color-mix(in srgb, var(--c-warn) 10%, transparent), color-mix(in srgb, var(--c-accent) 5%, transparent));
  border: 1px solid color-mix(in srgb, var(--c-warn) 22%, transparent);
  opacity: 0.8;
  filter: blur(18px);
}

.attention-field-node.attention-field-primary {
  border: 1px solid color-mix(in srgb, var(--c-warn) 38%, transparent);
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c-warn) 16%, transparent), transparent 72%);
  box-shadow: 0 0 38px color-mix(in srgb, var(--c-warn) 18%, transparent);
}

.attention-field-node.attention-field-secondary {
  border: 1px solid color-mix(in srgb, var(--c-warn) 18%, transparent);
  background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c-warn) 9%, transparent), transparent 74%);
  box-shadow: 0 0 24px color-mix(in srgb, var(--c-warn) 10%, transparent);
}

:root[data-theme="light"] .attention-field-region {
  background:
    radial-gradient(circle at 25% 30%, rgba(75, 188, 255, 0.16), transparent 62%),
    linear-gradient(135deg, rgba(75, 188, 255, 0.1), rgba(75, 188, 255, 0.05));
  border: 1px solid rgba(75, 188, 255, 0.22);
}

:root[data-theme="light"] .attention-field-node.attention-field-primary {
  border: 1px solid rgba(75, 188, 255, 0.4);
  background: radial-gradient(circle at 50% 50%, rgba(75, 188, 255, 0.18), transparent 72%);
  box-shadow: 0 0 38px rgba(75, 188, 255, 0.2);
}

:root[data-theme="light"] .attention-field-node.attention-field-secondary {
  border: 1px solid rgba(75, 188, 255, 0.18);
  background: radial-gradient(circle at 50% 50%, rgba(75, 188, 255, 0.1), transparent 74%);
  box-shadow: 0 0 24px rgba(75, 188, 255, 0.12);
}

/* Anchored to the canvas region (not the window): since the rail-chrome
   restructure the session panel owns the window's right edge. */
.attention-toast {
  position: absolute;
  top: 18px;
  right: 18px;
  max-width: min(360px, calc(100% - 36px));
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 6px 10px;
  background: color-mix(in srgb, var(--c-panel-glass) 96%, transparent);
  backdrop-filter: blur(14px);
  border: 1px solid color-mix(in srgb, var(--c-line) 76%, var(--c-warn) 24%);
  border-radius: 12px;
  box-shadow: 0 8px 22px var(--c-shadow);
  color: var(--c-text);
  font: inherit;
  cursor: pointer;
  z-index: 9990; /* above the world, below the rail popovers and every modal overlay */
  animation: attention-toast-in 180ms ease-out;
}

.attention-toast:hover {
  background: color-mix(in srgb, var(--c-panel-glass) 100%, transparent);
  box-shadow: 0 10px 28px var(--c-shadow-heavy);
}

.attention-toast:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
}

@keyframes attention-toast-in {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.attention-toast-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
  box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 28%, transparent);
}

.attention-toast-copy {
  display: grid;
  gap: 4px;
  min-width: 0;
  text-align: left;
  overflow-wrap: anywhere;
}

.attention-toast-detail {
  color: var(--c-text-soft);
  font-size: 12px;
  line-height: 1.45;
  max-height: 9em;
  overflow: auto;
}

.attention-toast-title {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.005em;
}

.attention-history {
  position: absolute;
  top: 60px;
  right: 18px;
  width: min(320px, calc(100% - 24px));
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  background: color-mix(in srgb, var(--c-panel-glass) 96%, transparent);
  backdrop-filter: blur(16px);
  border: 1px solid color-mix(in srgb, var(--c-line) 82%, var(--c-warn) 18%);
  border-radius: 18px;
  box-shadow: 0 14px 36px var(--c-shadow), 0 0 0 1px color-mix(in srgb, var(--c-warn) 8%, transparent);
  z-index: 9990;
}

.attention-history-tab {
  position: absolute;
  top: 60px;
  right: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px 8px 14px;
  background: color-mix(in srgb, var(--c-panel-glass) 96%, transparent);
  backdrop-filter: blur(16px);
  border: 1px solid color-mix(in srgb, var(--c-line) 82%, var(--c-warn) 18%);
  border-right: 0;
  border-radius: 14px 0 0 14px;
  box-shadow: 0 12px 36px var(--c-shadow);
  color: var(--c-text);
  cursor: pointer;
  font: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  z-index: 60;
}

.attention-history-tab:hover {
  border-color: color-mix(in srgb, var(--c-accent) 40%, var(--c-line) 60%);
  color: var(--c-accent);
}

.attention-history-tab svg {
  display: block;
  color: var(--c-accent);
  flex-shrink: 0;
}

.attention-history-tab-label {
  white-space: nowrap;
}

.attention-history-tab-badge {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  background: var(--c-warn);
  color: var(--c-contrast-fg);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
}

.attention-history-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 2px 4px;
}

.attention-history-header-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.attention-history-close {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--c-dim);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
}

.attention-history-close:hover {
  color: var(--c-text);
  background: var(--c-surface-hover);
}

.attention-history-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-text);
}

.attention-history-subtitle {
  font-size: 11px;
  color: var(--c-dim);
}

.attention-history-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.attention-history-entry {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 11px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--c-panel-soft) 78%, transparent);
  border: 1px solid transparent;
}

.attention-history-meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.attention-history-kind {
  font-size: 12px;
  font-weight: 700;
  color: var(--c-text);
}

.attention-history-time {
  font-size: 10px;
  color: var(--c-dim);
  white-space: nowrap;
}

.attention-history-detail {
  font-size: 12px;
  line-height: 1.45;
  color: var(--c-text-soft);
}

.attention-tone-context {
  border-color: color-mix(in srgb, var(--c-warn) 26%, transparent);
}

.attention-toast.attention-tone-context {
  color: color-mix(in srgb, var(--c-warn) 82%, var(--c-text) 18%);
}

.attention-tone-context .attention-history-kind,
.attention-tone-context .attention-toast-title {
  color: color-mix(in srgb, var(--c-warn) 82%, var(--c-text) 18%);
}

.attention-tone-relationship {
  border-color: color-mix(in srgb, var(--c-accent) 24%, transparent);
}

.attention-toast.attention-tone-relationship {
  color: color-mix(in srgb, var(--c-accent) 78%, var(--c-text) 22%);
}

.attention-tone-relationship .attention-history-kind,
.attention-tone-relationship .attention-toast-title {
  color: color-mix(in srgb, var(--c-accent) 78%, var(--c-text) 22%);
}

.attention-tone-group {
  border-color: color-mix(in srgb, var(--c-purple) 24%, transparent);
}

.attention-toast.attention-tone-group {
  color: color-mix(in srgb, var(--c-purple) 78%, var(--c-text) 22%);
}

.attention-tone-group .attention-history-kind,
.attention-tone-group .attention-toast-title {
  color: color-mix(in srgb, var(--c-purple) 78%, var(--c-text) 22%);
}

.attention-tone-cluster,
.attention-tone-neighborhood {
  border-color: color-mix(in srgb, var(--c-warn-alt) 22%, transparent);
}

.attention-toast.attention-tone-cluster,
.attention-toast.attention-tone-neighborhood {
  color: color-mix(in srgb, var(--c-warn-alt) 78%, var(--c-text) 22%);
}

.attention-tone-cluster .attention-history-kind,
.attention-tone-cluster .attention-toast-title,
.attention-tone-neighborhood .attention-history-kind,
.attention-tone-neighborhood .attention-toast-title {
  color: color-mix(in srgb, var(--c-warn-alt) 78%, var(--c-text) 22%);
}

.attention-tone-remove {
  border-color: color-mix(in srgb, var(--c-danger) 24%, transparent);
}

.attention-toast.attention-tone-remove {
  color: color-mix(in srgb, var(--c-danger) 78%, var(--c-text) 22%);
}

.attention-tone-remove .attention-history-kind,
.attention-tone-remove .attention-toast-title {
  color: color-mix(in srgb, var(--c-danger) 78%, var(--c-text) 22%);
}

/* ── Group node — spatial container/frame (groups v2, item 20) ─────
   Dashed frame with the name pill + action cluster ON the top edge; the
   children live in the world layer. The frame brightens while a dragged node
   would join on release; a collapsed group is a compact chip. */
.canvas-node.group-node {
  background: color-mix(in srgb, var(--group-color, var(--c-accent)) 3%, transparent);
  border: 1.5px dashed color-mix(in srgb, var(--group-color, var(--c-accent)) 35%, transparent);
  border-radius: 14px;
  box-shadow: none;
  overflow: visible;
  /* The edge row hangs outside the frame: no paint containment here. */
  contain: layout style;
  min-width: 200px;
  min-height: 120px;
  transition:
    border-color 150ms ease,
    background 150ms ease;
}
.canvas-node.group-node:hover {
  border-color: color-mix(in srgb, var(--group-color, var(--c-accent)) 55%, transparent);
}
.canvas-node.group-node.active,
.canvas-node.group-node.selected {
  border-style: dashed;
  border-color: color-mix(in srgb, var(--group-color, var(--c-accent)) 70%, transparent);
}
.canvas-node.group-node.is-drop-target {
  border-color: color-mix(in srgb, var(--group-color, var(--c-accent)) 80%, transparent);
  background: color-mix(in srgb, var(--group-color, var(--c-accent)) 9%, transparent);
}
.canvas-node.group-node.is-drop-source {
  border-color: color-mix(in srgb, var(--c-warn) 60%, transparent);
}
.canvas-node.group-node .node-body {
  background: none;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.group-empty-hint {
  font-size: 11px;
  color: var(--c-dim);
  font-style: italic;
  text-align: center;
  padding: 12px 18px;
  opacity: 0.8;
  pointer-events: none;
}

/* Frame edge row: the drag handle for the whole group */
.canvas-node.group-node .node-titlebar.group-edge-row {
  position: absolute;
  top: -12px;
  left: 12px;
  right: 12px;
  height: 24px;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  border-radius: 0;
  cursor: grab;
  overflow: visible;
}
.group-name-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--c-panel-soft);
  border: 1px solid color-mix(in srgb, var(--group-color, var(--c-accent)) 35%, transparent);
  max-width: 70%;
}
.group-name {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--group-color, var(--c-accent));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.group-count {
  font: 9px var(--mono);
  color: var(--c-dim);
}
.group-title-input {
  width: 140px;
  font-size: 11px;
}
.group-edge-spacer {
  flex: 1;
}
.group-actions {
  position: relative;
  display: inline-flex;
  gap: 1px;
  padding: 2px 4px;
  border-radius: 999px;
  background: var(--c-panel-soft);
  border: 1px solid var(--c-line);
}
.group-action {
  display: inline-flex;
  width: 20px;
  height: 20px;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  border-radius: 99px;
  color: var(--c-muted);
  cursor: pointer;
  font-size: 11px;
  line-height: 1;
  padding: 0;
}
.group-action:hover:not(:disabled) {
  color: var(--group-color, var(--c-accent));
}
.group-action:disabled {
  opacity: 0.35;
  cursor: default;
}
/* A group stacks BELOW its children by design (bringToFront re-stacks members
   above the frame), so the frame's own popover would paint under the member
   cards. While the ⋯ menu is open, lift the whole frame — !important because
   the node's z-index is an inline style from the store. */
.canvas-node.group-menu-open {
  z-index: 9500 !important;
}

.group-menu {
  position: absolute;
  top: 26px;
  right: 0;
  min-width: 160px;
  display: flex;
  flex-direction: column;
  padding: 4px;
  background: var(--c-panel);
  border: 1px solid var(--c-line);
  border-radius: 8px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
  z-index: 20;
}
.group-menu button {
  padding: 6px 10px;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--c-text-soft);
  font: inherit;
  font-size: 11px;
  text-align: left;
  cursor: pointer;
}
.group-menu button:hover:not(:disabled) {
  background: color-mix(in srgb, var(--c-text) 6%, transparent);
  color: var(--c-text);
}
.group-menu button:disabled {
  opacity: 0.4;
  cursor: default;
}
.group-menu button.is-danger:hover {
  color: var(--c-danger);
}

/* Collapsed group chip */
.canvas-node.group-node.group-chip {
  min-width: 0;
  min-height: 0;
  padding: 0;
  background: color-mix(in srgb, var(--group-color, var(--c-accent)) 4%, transparent);
  border: 1.5px dashed color-mix(in srgb, var(--group-color, var(--c-accent)) 35%, transparent);
  border-radius: 12px;
  cursor: pointer;
}
.canvas-node.group-node.group-chip:hover {
  border-color: color-mix(in srgb, var(--group-color, var(--c-accent)) 60%, transparent);
  background: color-mix(in srgb, var(--group-color, var(--c-accent)) 8%, transparent);
}
.canvas-node.group-node .node-titlebar.group-chip-inner {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: none;
  border: none;
  cursor: grab;
}
.group-chip-expand {
  background: none;
  border: none;
  padding: 0;
  color: var(--group-color, var(--c-accent));
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
}
.group-chip-name {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--group-color, var(--c-accent));
  white-space: nowrap;
}
.group-chip-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 4px;
}
.group-kind-dot {
  width: 6px;
  height: 6px;
  border-radius: 2px;
  opacity: 0.8;
}
.group-chip-count {
  font: 9px var(--mono);
  color: var(--c-dim);
}

/* Release pill under the dragged node */
.drop-pill {
  position: absolute;
  z-index: 10000;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--c-panel) 96%, transparent);
  border: 1px solid color-mix(in srgb, var(--c-accent) 40%, transparent);
  pointer-events: none;
  white-space: nowrap;
}
.drop-pill-text {
  font-size: 10px;
  font-weight: 600;
  color: var(--c-accent);
}
.drop-pill-hint {
  font: 9px var(--mono);
  color: var(--c-dim);
}

/* ── Context pin bar — persistent floating indicator ─────────── */
.context-pin-bar {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--c-panel-glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--c-warn);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px var(--c-shadow), 0 0 0 1px var(--c-warn-15);
  z-index: 64;
  white-space: nowrap;
}

.context-pin-bar-count {
  font-size: 12px;
  font-weight: 600;
  color: var(--c-warn);
}

.context-pin-bar-btn {
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  background: var(--c-warn-10);
  border: 1px solid var(--c-warn-30);
  border-radius: var(--radius-sm);
  color: var(--c-warn);
  cursor: pointer;
  font-family: var(--font);
}

.context-pin-bar-btn:hover {
  background: var(--c-warn-20);
  border-color: var(--c-warn);
}

.context-pin-bar-ask {
  background: var(--c-warn);
  color: var(--c-contrast-fg);
  border-color: var(--c-warn);
}

.context-pin-bar-ask:hover {
  background: var(--c-warn-hover);
  border-color: var(--c-warn-hover);
}

.context-pin-bar-clear {
  background: none;
  border: none;
  color: var(--c-muted);
  font-size: 16px;
  padding: 2px 6px;
  line-height: 1;
}

.context-pin-bar-clear:hover {
  color: var(--c-text);
  background: var(--c-surface-hover);
}

/* ── Expanded overlay actions ────────────────────────────────── */
/* Expanded node view (rail-chrome-v2 phase 7, item 16): scrim + inset panel
   with 36/48px margins, header with kind pill + pin state, footer strip. */
.expanded-overlay-backdrop {
  position: absolute;
  inset: 0;
  z-index: 10001;
  background: rgba(4, 10, 18, 0.6);
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 36px 48px;
}
.expanded-overlay-panel {
  flex: 1;
  max-width: 1400px;
  display: flex;
  flex-direction: column;
  background: var(--c-panel);
  border: 1px solid var(--c-line);
  border-radius: 14px;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}
.expanded-overlay-panel.is-pinned {
  border-color: color-mix(in srgb, var(--c-warn) 45%, var(--c-line));
}
.expanded-header {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 46px;
  padding: 0 16px;
  border-bottom: 1px solid var(--c-line);
  background: color-mix(in srgb, var(--c-bg) 60%, transparent);
  flex-shrink: 0;
}
.expanded-kind-icon {
  display: inline-flex;
  color: var(--c-accent);
}
.expanded-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.expanded-kind-pill {
  font-size: 9px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--c-line);
  color: var(--c-muted);
  white-space: nowrap;
}
.expanded-pin {
  background: none;
  border: none;
  padding: 0 2px;
  font-size: 12px;
  color: var(--c-dim);
  cursor: pointer;
}
.expanded-pin.is-on {
  color: var(--c-warn);
}
.expanded-spacer {
  flex: 1;
}
.expanded-close {
  background: none;
  border: none;
  color: var(--c-muted);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  padding: 0 4px;
}
.expanded-close:hover {
  color: var(--c-text);
}
.expanded-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 16px;
}
.expanded-body.is-embedded {
  display: flex;
  flex-direction: column;
}
.expanded-footer {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  border-top: 1px solid var(--c-line);
  background: color-mix(in srgb, var(--c-bg) 50%, transparent);
  font: 9.5px var(--mono);
  color: var(--c-dim);
  flex-shrink: 0;
}
.expanded-footer-hint.is-saving {
  color: var(--c-warn);
}
.expanded-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.expanded-action-btn {
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 600;
  background: var(--c-panel-soft);
  border: 1px solid var(--c-line);
  border-radius: var(--radius-sm);
  color: var(--c-text-soft);
  cursor: pointer;
  font-family: var(--font);
}

.expanded-action-btn:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
  border-color: var(--c-muted);
}

.expanded-action-btn.expanded-action-primary {
  background: var(--c-accent-12);
  border-color: var(--c-accent-30);
  color: var(--c-accent);
}

.expanded-action-btn.expanded-action-primary:hover {
  background: var(--c-accent-25);
  border-color: var(--c-accent);
  color: var(--c-text);
}

.expanded-action-btn.expanded-action-active {
  background: var(--c-warn-12);
  border-color: var(--c-warn-30);
  color: var(--c-warn);
}

.expanded-action-btn.expanded-action-active:hover {
  background: var(--c-warn-20);
  border-color: var(--c-warn);
}

.expanded-meta {
  font-size: 10px;
  color: var(--c-muted);
  padding: 0 4px;
}

.html-presentation-overlay {
  position: fixed;
  inset: 0;
  z-index: 10050;
  display: flex;
  padding: 0;
  background:
    radial-gradient(circle at top left, var(--c-accent-25), transparent 36rem),
    rgba(3, 7, 18, 0.96);
  color: var(--c-text);
}

.html-presentation-exit {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 1;
  padding: 10px 14px;
  border: 1px solid var(--c-line);
  border-radius: 999px;
  background: var(--c-panel-glass);
  box-shadow: 0 18px 50px var(--c-shadow-heavy);
  color: var(--c-text-soft);
  cursor: pointer;
  font: 600 12px/1 var(--font);
  opacity: 0;
  pointer-events: none;
  transform: translateY(-6px);
  transition: opacity 0.15s ease, transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.html-presentation-exit:hover,
.html-presentation-exit:focus-visible {
  border-color: var(--c-accent);
  color: var(--c-text);
}

.html-presentation-exit:focus,
.html-presentation-exit:focus-visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.html-presentation-stage {
  flex: 1;
  min-height: 0;
  display: flex;
  border-radius: 0;
  background: var(--c-bg);
  overflow: hidden;
}

.html-node-frame-presentation {
  flex: 1;
  min-height: 0;
  border-radius: 0 !important;
}

/* ── Context pin button on node title bar ────────────────────── */
.node-controls .ctx-pin-btn {
  color: var(--c-muted);
  opacity: 0;
  transition: opacity 0.15s;
}

.canvas-node:hover .ctx-pin-btn {
  opacity: 0.7;
}

.ctx-pin-btn.ctx-pin-active {
  color: var(--c-warn);
  opacity: 1 !important;
}

:root[data-theme="light"] .ctx-pin-btn.ctx-pin-active {
  color: #4BBCFF;
}

/* ── Context pin HUD — top-right pill ────────────────────────── */
.context-pin-hud {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  background: var(--c-panel-glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--c-warn-30);
  border-radius: var(--radius);
  white-space: nowrap;
}

.context-pin-hud-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--c-warn);
}

.context-pin-hud-clear {
  background: none;
  border: none;
  color: var(--c-muted);
  font-size: 14px;
  padding: 0 2px;
  cursor: pointer;
  line-height: 1;
}

.context-pin-hud-clear:hover {
  color: var(--c-text);
}

/* ── Thread turn styles ──────────────────────────────────────── */
.thread-turn-user {
  padding: 8px 0;
}

.thread-turn-assistant {
  padding: 6px 0;
  border-left: 2px solid var(--c-ok-20);
  padding-left: 10px;
  margin-left: 2px;
  overflow: hidden;
}

/* Keep list markers inside the content box so they don't overlap the green border */
.thread-turn-assistant ol,
.thread-turn-assistant ul {
  list-style-position: inside;
  padding-left: 0;
}

.thread-turn-assistant li {
  padding-left: 4px;
}

.thread-turn-role {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.thread-turn-role .status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.thread-turn-user .thread-turn-role {
  color: var(--c-accent);
}

.thread-turn-user .status-dot {
  background: var(--c-accent);
}

.thread-turn-assistant .thread-turn-role {
  color: var(--c-ok);
}

.thread-turn-assistant .status-dot {
  background: var(--c-ok);
}

.thread-turn-assistant .status-dot.pulsing {
  animation: status-dot-pulse 2s ease-in-out infinite;
}

@keyframes status-dot-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.8); }
}

.thread-turn-divider {
  height: 1px;
  background: var(--c-line);
  margin: 6px 0;
  opacity: 0.35;
}

/* Blinking cursor shown at the end of streaming text */
.streaming-cursor {
  display: inline-block;
  width: 6px;
  height: 14px;
  background: var(--c-ok);
  border-radius: 1px;
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: cursor-blink 0.8s step-end infinite;
}

@keyframes cursor-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

.thread-reply-area {
  margin-top: 2px;
}

/* ── Snapshot Panel ───────────────────────────────────────── */

/* History drawer (rail-chrome-v2 phase 7, item 8): snapshots + sessions as
   one reverse-chronological list in a right drawer of the canvas region. */
.snapshot-panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(300px, 100%);
  display: flex;
  flex-direction: column;
  background: var(--c-panel-soft);
  border-left: 1px solid var(--c-line);
  box-shadow: -16px 0 40px rgba(0, 0, 0, 0.45);
  /* Above the receipt it is opened from, below the rail popovers. */
  z-index: 9999;
  overflow: hidden;
  animation: snapshot-panel-in 0.18s ease-out;
}

@keyframes snapshot-panel-in {
  from { opacity: 0; transform: translateX(12px); }
  to   { opacity: 1; transform: translateX(0); }
}

.snapshot-panel-header {
  display: flex;
  align-items: center;
  gap: 8px;
  height: var(--hud-bar-height);
  padding: 0 14px;
  border-bottom: 1px solid var(--c-line);
  flex-shrink: 0;
}
.snapshot-panel-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-text);
}
.snapshot-panel-sub {
  font-size: 10px;
  color: var(--c-dim);
}
.snapshot-panel-spacer {
  flex: 1;
}
.snapshot-panel-close {
  background: none;
  border: none;
  color: var(--c-muted);
  font-size: 14px;
  cursor: pointer;
  padding: 0 2px;
}
.snapshot-panel-close:hover {
  color: var(--c-text);
}

.snapshot-save-form {
  display: flex;
  gap: 6px;
  padding: 10px 12px 6px;
}
.snapshot-name-input {
  flex: 1;
  min-width: 0;
  padding: 6px 10px;
  border: 1px solid var(--c-line);
  border-radius: 7px;
  background: var(--c-panel);
  color: var(--c-text);
  font: 11.5px var(--font);
}
.snapshot-name-input:focus {
  outline: 2px solid var(--c-accent);
  outline-offset: 1px;
}
.snapshot-name-input::placeholder {
  color: var(--c-dim);
}
.snapshot-save-btn {
  padding: 6px 12px;
  border: none;
  border-radius: 7px;
  background: var(--c-accent);
  color: var(--c-bg);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.snapshot-save-btn:disabled {
  opacity: 0.45;
  cursor: default;
}
.snapshot-restore-note {
  padding: 0 12px 8px;
  font-size: 9.5px;
  color: var(--c-dim);
}

.snapshot-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 4px 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.snapshot-empty {
  padding: 14px 2px;
  font-size: 11px;
  color: var(--c-dim);
}
.snapshot-section-header {
  margin: 10px 2px 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-muted);
}

.snapshot-item {
  padding: 10px 12px;
  border: 1px solid var(--c-line);
  border-radius: 10px;
}
.snapshot-item.is-session {
  border-color: color-mix(in srgb, var(--c-purple) 30%, transparent);
  background: color-mix(in srgb, var(--c-purple) 5%, transparent);
}
.snapshot-item-head {
  display: flex;
  align-items: center;
  gap: 7px;
}
.snapshot-session-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c-purple);
  flex-shrink: 0;
}
.snapshot-item-glyph {
  color: var(--c-muted);
  font-size: 12px;
  line-height: 1;
}
.snapshot-item-name {
  flex: 1;
  min-width: 0;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-text-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.snapshot-item.is-session .snapshot-item-name {
  color: var(--c-text);
}
.snapshot-item-time {
  font: 9px var(--mono);
  color: var(--c-dim);
}
.snapshot-item-meta {
  margin-top: 3px;
  font-size: 10.5px;
  color: var(--c-muted);
}
.snapshot-item-diff {
  color: var(--c-accent);
}
.snapshot-item-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.snapshot-action-btn {
  flex: 1;
  padding: 5px 0;
  border: 1px solid var(--c-line);
  border-radius: 6px;
  background: none;
  color: var(--c-muted);
  font-size: 10.5px;
  font-weight: 600;
  cursor: pointer;
}
.snapshot-action-btn:hover:not(:disabled) {
  color: var(--c-text);
}
.snapshot-action-btn:disabled {
  opacity: 0.5;
  cursor: default;
}
.snapshot-action-diff,
.snapshot-action-restore {
  background: color-mix(in srgb, var(--c-accent) 12%, transparent);
  border-color: color-mix(in srgb, var(--c-accent) 30%, transparent);
  color: var(--c-accent);
}
.snapshot-action-diff:hover:not(:disabled),
.snapshot-action-restore:hover:not(:disabled) {
  background: color-mix(in srgb, var(--c-accent) 20%, transparent);
  color: var(--c-accent);
}
.snapshot-action-delete {
  flex: 0 0 auto;
  padding: 5px 9px;
}
.snapshot-action-delete:hover:not(:disabled) {
  border-color: color-mix(in srgb, var(--c-danger) 40%, transparent);
  color: var(--c-danger);
}
.snapshot-action-confirm {
  background: color-mix(in srgb, var(--c-danger) 12%, transparent);
  border-color: color-mix(in srgb, var(--c-danger) 40%, transparent);
  color: var(--c-danger);
}
.snapshot-panel-foot {
  padding: 9px 14px;
  border-top: 1px solid var(--c-line);
  font-size: 9.5px;
  color: var(--c-dim);
  flex-shrink: 0;
}

/* ── Command Palette (Cmd/Ctrl+K) ──────────────────────────── */

.command-palette-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10002;
  background: rgba(4, 10, 18, 0.55);
  display: flex;
  justify-content: center;
  padding-top: 56px;
}

/* ⌘K palette (rail-chrome-v2 phase 7, item 7): 560px, top-anchored at 56px,
   grouped results, footer key hints. */
.command-palette {
  width: min(560px, calc(100% - 48px));
  max-height: min(520px, calc(100vh - 80px));
  display: flex;
  flex-direction: column;
  background: var(--c-panel);
  border: 1px solid var(--c-line);
  border-radius: 12px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  overflow: hidden;
  animation: command-palette-in 0.12s ease-out;
  align-self: flex-start;
}

@keyframes command-palette-in {
  from { opacity: 0; transform: translateY(-8px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.command-palette-search {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--c-line);
  color: var(--c-accent);
}
.command-palette-input {
  flex: 1;
  min-width: 0;
  padding: 0;
  border: none;
  outline: none;
  background: none;
  color: var(--c-text);
  font: 13px var(--font);
}
.command-palette-input::placeholder {
  color: var(--c-dim);
}
.command-palette-esc,
.command-palette-kbd {
  padding: 1px 6px;
  border: 1px solid var(--c-line);
  border-radius: 4px;
  font: 9.5px var(--mono);
  color: var(--c-muted);
}
.command-palette-esc {
  padding: 2px 7px;
  border-radius: 5px;
  color: var(--c-dim);
}

.command-palette-results {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 6px 6px 4px;
}
.command-palette-empty {
  padding: 14px 10px;
  font-size: 12px;
  color: var(--c-dim);
}
.command-palette-group {
  padding: 6px 10px 4px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-dim);
}
.command-palette-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 7px 10px;
  border: none;
  border-radius: 8px;
  background: none;
  color: var(--c-text-soft);
  cursor: pointer;
  text-align: left;
  font: inherit;
}
.command-palette-item:hover {
  background: color-mix(in srgb, var(--c-text) 5%, transparent);
}
.command-palette-item.selected,
.command-palette-item.selected:hover {
  background: color-mix(in srgb, var(--c-accent) 12%, transparent);
  color: var(--c-text);
}
.command-palette-icon {
  display: inline-flex;
  flex-shrink: 0;
  width: 14px;
  height: 14px;
  color: var(--c-accent);
}
.command-palette-icon.tone-purple {
  color: var(--c-purple);
}
.command-palette-icon.tone-muted {
  color: var(--c-muted);
}
.command-palette-label {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.command-palette-label mark {
  background: none;
  color: var(--c-accent);
  font-weight: 600;
}
.command-palette-desc {
  color: var(--c-dim);
}

.command-palette-hint {
  display: flex;
  gap: 14px;
  padding: 8px 14px;
  border-top: 1px solid var(--c-line);
  background: color-mix(in srgb, var(--c-bg) 50%, transparent);
  font: 9.5px var(--mono);
  color: var(--c-dim);
}
.command-palette-hint-spacer {
  flex: 1;
}

/* ── Shortcut Overlay (Press ?) ────────────────────────────── */

.shortcut-overlay-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10003;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  justify-content: center;
  align-items: center;
}

.shortcut-overlay {
  width: 540px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  background: var(--c-panel-glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--c-line);
  border-radius: var(--radius);
  box-shadow: 0 12px 40px var(--c-shadow-heavy), 0 0 0 1px rgba(255,255,255,0.04);
  overflow: hidden;
  animation: command-palette-in 0.12s ease-out;
}

.shortcut-overlay-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--c-line);
}

.shortcut-overlay-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text);
}

.shortcut-overlay-hint {
  font-size: 10px;
  color: var(--c-dim);
}
.shortcut-overlay-hint kbd {
  display: inline-block;
  background: var(--c-surface-hover);
  border: 1px solid var(--c-line);
  border-radius: 3px;
  padding: 0 4px;
  font-family: var(--font);
  font-size: 9px;
  line-height: 1.6;
  margin: 0 2px;
}

.shortcut-overlay-body {
  overflow-y: auto;
  padding: 8px 20px 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.shortcut-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.shortcut-group-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--c-accent);
  margin-bottom: 2px;
}

.shortcut-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.shortcut-keys {
  display: inline-block;
  background: var(--c-input-bg);
  border: 1px solid var(--c-line);
  border-radius: 4px;
  padding: 2px 7px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--c-text);
  white-space: nowrap;
  min-width: 60px;
  text-align: center;
  flex-shrink: 0;
}

.shortcut-desc {
  font-size: 11px;
  color: var(--c-muted);
  line-height: 1.4;
}

/* ── Empty board (rail-chrome-v2 phase 7, design item 11) ───── */
.empty-state {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
  width: 560px;
  max-width: calc(100% - 48px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  animation: empty-state-in 0.4s ease-out;
}
@keyframes empty-state-in {
  from {
    opacity: 0;
    transform: translate(-50%, -46%);
  }
  to {
    opacity: 1;
    transform: translate(-50%, -50%);
  }
}
.empty-state-mark {
  stroke: var(--c-line);
  stroke-width: 2.5;
}
.empty-state-mark rect + rect {
  stroke: color-mix(in srgb, var(--c-line) 70%, var(--c-accent));
}
.empty-state-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--c-text);
}
.empty-state-sub {
  margin-top: 6px;
  font-size: 12.5px;
  color: var(--c-muted);
}
.empty-state-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
}
.empty-state-action {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  background: var(--c-panel);
  border: 1px solid var(--c-line);
  border-radius: 10px;
  color: var(--c-text-soft);
  cursor: pointer;
  text-align: left;
  font: inherit;
}
.empty-state-action:hover {
  border-color: color-mix(in srgb, var(--c-accent) 40%, transparent);
}
.empty-state-action.is-agent:hover {
  border-color: color-mix(in srgb, var(--c-purple) 45%, transparent);
}
.empty-state-action .tone-accent {
  color: var(--c-accent);
}
.empty-state-action .tone-warn {
  color: var(--c-warn);
}
.empty-state-action .tone-ok {
  color: var(--c-ok);
}
.empty-state-action .tone-purple {
  color: var(--c-purple);
}
.empty-state-action-label {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
}
.empty-state-action kbd {
  padding: 1px 6px;
  border: 1px solid var(--c-line);
  border-radius: 4px;
  font: 9.5px var(--mono);
  color: var(--c-dim);
}
.empty-state-action-hint {
  font-size: 10px;
  color: var(--c-dim);
}
.empty-state-hint {
  background: none;
  border: none;
  padding: 0;
  font: 10.5px var(--mono);
  color: var(--c-dim);
  cursor: pointer;
}
.empty-state-hint:hover {
  color: var(--c-muted);
}

@media (max-width: 980px) {
  .attention-toast {
    left: 12px;
    right: 12px;
    width: auto;
  }

  .attention-history {
    top: auto;
    left: 12px;
    right: 12px;
    bottom: 84px;
    width: auto;
  }

}

@media (prefers-reduced-motion: reduce) {
  .attention-toast,
  .empty-state,
  .canvas-node.attention-pulse {
    animation: none !important;
  }

  .attention-field-region,
  .attention-field-node,
  .canvas-node {
    transition: none !important;
  }
}




/* ── Image Node ─────────────────────────────────────────────── */
.image-node {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

.image-node-warning-stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 8px 0;
}

.image-node-warning {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--c-warn) 42%, var(--c-line) 58%);
  background: color-mix(in srgb, var(--c-warn) 12%, var(--c-panel-soft) 88%);
  color: var(--c-text);
}

.image-node-warning-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: color-mix(in srgb, var(--c-warn) 88%, var(--c-text) 12%);
}

.image-node-warning-detail {
  font-size: 11px;
  line-height: 1.35;
  color: var(--c-text-soft);
}

.image-node-viewport {
  flex: 1;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: repeating-conic-gradient(
    var(--c-surface-subtle) 0% 25%,
    transparent 0% 50%
  ) 50% / 16px 16px;
  position: relative;
  min-height: 80px;
  border-radius: var(--radius-sm);
}

.image-node-viewport img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: opacity 0.2s ease;
  transform-origin: center center;
  user-select: none;
  -webkit-user-drag: none;
}

.image-node-expanded .image-node-viewport img {
  max-width: none;
  max-height: none;
  width: auto;
  height: auto;
}

.image-node-loading,
.image-node-error {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 24px;
  color: var(--c-dim);
  font-size: 12px;
  position: absolute;
  inset: 0;
}

.image-node-error-icon {
  font-size: 24px;
  opacity: 0.5;
}

.image-node-error-path {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--c-muted);
  word-break: break-all;
  max-width: 250px;
  text-align: center;
}

.image-node-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 100%;
  color: var(--c-dim);
}

.image-node-empty-icon {
  font-size: 32px;
  opacity: 0.4;
}

.image-node-empty-text {
  font-size: 12px;
}

.image-node-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 10px;
  border-top: 1px solid var(--c-line);
  background: var(--c-panel-soft);
  font-size: 10px;
  color: var(--c-dim);
  gap: 8px;
  min-height: 24px;
  margin-top: 8px;
}

.image-node-caption {
  color: var(--c-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.image-node-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.image-node-zoom-reset {
  background: none;
  border: 1px solid var(--c-line);
  border-radius: 3px;
  padding: 1px 6px;
  font: inherit;
  font-size: 10px;
  color: var(--c-accent);
  cursor: pointer;
}

.image-node-zoom-reset:hover {
  background: var(--c-surface-hover);
}

/* ── Ghost Cursor of Intent ─────────────────────────────────────
   Pre-commit presence: faint placeholders for the move the agent is about to
   make. Lives inside the canvas world transform (positions are world coords).
   The layer sits above nodes so remove/edit overlays read on top of their
   target, but is pointer-transparent except the info card + veto control. */
.intent-layer {
  display: contents;
}

/* Auto-ghosts (server-synthesized for unlinked agent mutations) read lighter
   than a deliberate canvas_intent signal: desaturated, dotted, no veto —
   the opacity drop lives in ghostOpacity() (inline style). */
.intent-ghost.is-auto {
  filter: saturate(0.7);
  border-style: dotted;
}

.intent-ghost.is-auto .intent-ghost-titlebar,
.intent-ghost.is-auto .intent-chip {
  border-style: dotted;
}

.intent-ghost {
  position: absolute;
  pointer-events: none;
  z-index: 100000;
  transition:
    left 480ms ease,
    top 480ms ease,
    width 480ms ease,
    height 480ms ease,
    opacity 180ms ease;
}

/* create / move destination — a dashed ghost node */
.intent-ghost-box {
  border: 1.5px dashed var(--c-accent);
  border-radius: 10px;
  background: var(--c-accent-10);
  box-shadow: 0 0 0 1px var(--c-accent-10), 0 6px 22px var(--c-accent-10);
  animation: intent-breathe 2.1s ease-in-out infinite;
  overflow: visible;
}

.intent-ghost-titlebar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  color: var(--c-accent);
}

.intent-ghost-icon {
  display: inline-flex;
  align-items: center;
  color: var(--c-accent);
}

.intent-ghost-badge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--c-accent);
  opacity: 0.85;
}

@keyframes intent-breathe {
  0%, 100% { box-shadow: 0 0 0 1px var(--c-accent-10), 0 6px 22px var(--c-accent-10); }
  50%      { box-shadow: 0 0 0 1px var(--c-accent-25), 0 8px 30px var(--c-accent-25); }
}

/* remove — a red crosshatch tombstone over the target */
.intent-ghost-remove {
  border: 1.5px dashed var(--c-danger);
  border-radius: 10px;
  background-color: color-mix(in srgb, var(--c-danger) 8%, transparent);
  background-image: repeating-linear-gradient(
    45deg,
    color-mix(in srgb, var(--c-danger) 22%, transparent) 0,
    color-mix(in srgb, var(--c-danger) 22%, transparent) 2px,
    transparent 2px,
    transparent 9px
  );
}

/* edit — a shimmer bar over the target */
.intent-ghost-edit {
  border: 1.5px dashed var(--c-accent);
  border-radius: 10px;
  background: var(--c-accent-10);
  overflow: visible;
}

.intent-edit-bar {
  position: absolute;
  top: 0;
  left: 0;
  height: 3px;
  width: 100%;
  background: linear-gradient(90deg, transparent, var(--c-accent), transparent);
  animation: response-stream-pulse 1.5s ease-in-out infinite;
}

/* connect — info card anchored at the bezier midpoint */
.intent-ghost-connect {
  display: flex;
  justify-content: center;
}

/* the info treatment: label + confidence chip, reason, seq, veto */
.intent-info {
  position: absolute;
  top: 100%;
  left: 0;
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  pointer-events: auto;
  max-width: 280px;
}

.intent-ghost-connect .intent-info {
  position: static;
  margin-top: 0;
  align-items: center;
}

.intent-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  padding: 3px 6px 3px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--c-panel-glass) 96%, transparent);
  backdrop-filter: blur(10px);
  border: 1px solid var(--c-accent-25);
  box-shadow: 0 4px 14px var(--c-shadow);
  color: var(--c-text);
  font-size: 12px;
  line-height: 1.2;
}

.intent-seq {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--c-accent);
  color: var(--c-bg);
  font-size: 10px;
  font-weight: 700;
}

.intent-chip-icon {
  display: inline-flex;
  align-items: center;
  color: var(--c-accent);
}

.intent-chip-label {
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 180px;
}

.intent-confidence {
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  color: var(--c-muted);
}

.intent-veto {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  margin-left: 2px;
  padding: 0;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--c-muted);
  font-size: 11px;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
}

.intent-veto:hover {
  background: color-mix(in srgb, var(--c-danger) 18%, transparent);
  color: var(--c-danger);
}

.intent-reason {
  align-self: flex-start;
  padding: 3px 8px;
  border-radius: 7px;
  background: color-mix(in srgb, var(--c-panel-glass) 92%, transparent);
  border: 1px solid var(--c-line);
  color: var(--c-muted);
  font-size: 11px;
  line-height: 1.35;
}

/* connect bezier + move trail (SVG) */
.intent-line-layer path {
  fill: none;
}

.intent-line-layer {
  z-index: 99999;
}

.intent-edge {
  stroke-width: 2;
  stroke-dasharray: 6 5;
  animation: intent-dash 0.9s linear infinite;
}

.intent-edge.type-flow { stroke: var(--c-accent); }
.intent-edge.type-depends-on { stroke: var(--c-warn); }
.intent-edge.type-relation { stroke: var(--c-muted); }
.intent-edge.type-references { stroke: var(--c-dim); }

.intent-trail {
  stroke: var(--c-accent);
  stroke-width: 2;
  stroke-dasharray: 5 5;
  animation: intent-dash 0.9s linear infinite;
}

.intent-arrow-head {
  fill: var(--c-accent);
}

@keyframes intent-dash {
  to { stroke-dashoffset: -22; }
}

/* settle — the ghost becomes real, then clears */
.intent-ghost.is-settling {
  animation: intent-settle 480ms ease forwards;
}

@keyframes intent-settle {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.04); border-style: solid; opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}

/* dissolve — abandoned / vetoed / expired */
.intent-ghost.is-dissolving {
  animation: intent-dissolve 320ms ease forwards;
}

@keyframes intent-dissolve {
  to { transform: scale(0.96); opacity: 0; filter: blur(2px); }
}

/* keep ghosts calm while a node is being dragged */
html.is-node-dragging .intent-ghost,
html.is-node-dragging .intent-line-layer {
  opacity: 0.5;
}

.present-button {
  color: var(--c-text);
  background: var(--c-bg);
  border: 1px solid var(--c-line);
  border-radius: 6px;
  padding: 4px 12px;
  cursor: pointer;
}
.is-presenting > :not(.app-main):not(.presentation-error):not(.presentation-navigation),
.is-presenting .app-main > :not(.canvas-region),
.is-presenting .canvas-region > :not(.canvas-viewport) {
  display: none !important;
}
.is-presenting .canvas-viewport { pointer-events: none; }
.presentation-navigation {
  position: fixed;
  inset: 0;
  z-index: 99;
}
.presentation-exit {
  position: absolute;
  top: 16px;
  right: 16px;
  box-shadow: 0 2px 12px var(--c-shadow);
}
.presentation-error {
  position: fixed;
  bottom: 16px;
  left: 16px;
  z-index: 100;
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  border: 1px solid var(--c-line);
  border-radius: 6px;
  background: var(--c-panel);
  color: var(--c-text);
}

/* ── Many boards (plan 012): top-bar switcher + Home ── */
.board-switcher {
  display: inline-flex;
  /* The board name is the bar's identity: it keeps room for a short name
     ("Home") when chips crowd a 600px pane; long names still ellipsize. */
  min-width: 88px;
  flex-shrink: 1;
}
.board-switcher-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 280px;
  padding: 6px 8px;
  margin-left: -8px;
  background: none;
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
}
.board-switcher-button:hover,
.board-switcher-button[aria-expanded='true'] {
  border-color: var(--c-line);
  background: var(--c-panel);
}
.board-switcher-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.board-switcher-caret {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--c-text-soft);
}
.board-switcher-menu {
  width: min(340px, calc(100vw - 24px));
  min-width: 0;
  padding: 8px;
  background: var(--c-panel);
  backdrop-filter: none;
  overflow: hidden;
}
.board-switcher-heading {
  padding: 8px 10px 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--c-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  flex-shrink: 0;
}
.board-switcher-recents { min-height: 0; overflow-y: auto; }
.board-switcher-menu .toolbar-menu-item { padding: 10px; gap: 12px; }
.board-switcher-menu .toolbar-menu-item:hover,
.board-switcher-menu .toolbar-menu-item:focus-visible {
  background: var(--c-accent-8);
  border-color: var(--c-accent-25);
  outline: none;
}
.board-switcher-icon { display: flex; align-items: center; justify-content: center; width: 20px; flex-shrink: 0; color: var(--c-accent); font-size: 22px; }
.board-switcher-item-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.board-switcher-item-name {
  color: var(--c-text);
  font-weight: 500;
  line-height: 1.35;
  overflow-wrap: anywhere;
  text-align: left;
}
.board-switcher-item-folder { font-size: 11px; line-height: 1.4; color: var(--c-dim); overflow-wrap: anywhere; }
.board-switcher-item-meta {
  font-size: 10px;
  color: var(--c-dim);
  white-space: nowrap;
  align-self: flex-start;
  padding-top: 2px;
}
.board-switcher-actions { border-top: 1px solid var(--c-line); margin-top: 6px; padding-top: 6px; flex-shrink: 0; }

.home-view {
  position: absolute;
  inset: 0;
  /* Above the canvas's floating chrome (the updates tab sits at 60), below menus and prompts. */
  z-index: 70;
  overflow-y: auto;
  background: var(--c-bg);
  padding: 32px 16px;
}
.home-view-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.home-view-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.home-view-title {
  margin: 0;
  font-size: 20px;
  font-weight: 650;
  color: var(--c-text);
}
.home-view-new {
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--c-accent);
  background: var(--c-accent);
  color: var(--c-bg);
  font-weight: 600;
  cursor: pointer;
}
.home-view-empty {
  color: var(--c-text-soft);
  font-size: 13px;
}
.home-view-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.home-board {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px 7px 5px;
  border: 1px solid var(--c-line);
  border-radius: 10px;
  background: var(--c-panel);
}
.home-board.is-confirming {
  border-color: var(--c-danger);
  padding: 10px 12px;
  flex-wrap: wrap;
}
.home-board-open {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 6px 8px;
  background: none;
  border: none;
  border-radius: 8px;
  color: var(--c-text);
  cursor: pointer;
  text-align: left;
}
.home-board-open:hover {
  background: color-mix(in srgb, var(--c-accent) 10%, transparent);
}
.home-board-name {
  max-width: 100%;
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.home-board-meta {
  font: 11px var(--mono);
  color: var(--c-text-soft);
}
.home-board-confirm-text {
  flex: 1 1 240px;
  font-size: 13px;
  color: var(--c-text);
}
.home-board-actions {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}
.home-board-action {
  padding: 6px 7px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: none;
  color: var(--c-dim);
  font-size: 11px;
  cursor: pointer;
}
.home-board-action:hover {
  border-color: var(--c-line);
  background: color-mix(in srgb, var(--c-text) 5%, transparent);
  color: var(--c-text-soft);
}
.home-board-action.is-danger {
  border-color: var(--c-danger);
  background: var(--c-danger);
  color: var(--c-bg);
  font-weight: 600;
}
.home-board-open:focus-visible,
.home-board-action:focus-visible,
.home-view-new:focus-visible,
.board-switcher-button:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
}

/* ── Board export dialog (plan 013) ── */
.export-dialog {
  width: min(520px, calc(100% - 32px));
}
.export-dialog-note {
  font-size: 12px;
  color: var(--c-text-soft);
}
.export-dialog-list {
  margin: 0;
  padding-left: 18px;
  font-size: 13px;
  color: var(--c-text);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.export-dialog-files {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-size: 12px;
  color: var(--c-text);
  word-break: break-all;
}
.export-dialog-result {
  font-size: 12px;
  color: var(--c-text);
  display: flex;
  flex-direction: column;
  gap: 6px;
  word-break: break-all;
}
.export-dialog-links {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
}
.export-dialog-links a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  text-decoration: none;
  word-break: normal;
}

/* ── Home categories ── */
.home-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.home-section-head {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 42px;
  width: 100%;
  padding: 9px 10px;
  background: none;
  border: none;
  border-radius: 8px;
  color: var(--c-text-soft);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  cursor: pointer;
  text-align: left;
}
.home-section-head:hover {
  color: var(--c-text);
  background: color-mix(in srgb, var(--c-text) 5%, transparent);
}
.home-section-chevron,
.home-section-folder {
  flex: 0 0 18px;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.home-section-chevron {
  transition: transform 120ms ease;
}
.home-section-head[aria-expanded='true'] .home-section-chevron {
  transform: rotate(90deg);
}
.home-section-folder { color: var(--c-dim); }
.home-section-count {
  font: 11px var(--mono);
  text-transform: none;
  color: var(--c-dim);
  margin-left: auto;
}
.home-section-head:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
}
.home-section-head {
  text-transform: none;
  letter-spacing: normal;
  max-width: 100%;
}
.home-section-name {
  font-size: 13px;
  font-weight: 650;
  overflow-wrap: anywhere;
}
.home-folder-children {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-left: 12px;
  border-left: 1px solid var(--c-line);
}
.home-search { width: 100%; box-sizing: border-box; }
.board-copy-dialog,
.board-link-dialog {
  width: min(540px, calc(100vw - 32px));
  max-height: calc(100dvh - 40px);
  overflow-y: auto;
  box-sizing: border-box;
}
.board-copy-dialog form,
.board-copy-field,
.board-copy-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.board-copy-dialog h2,
.board-link-dialog h2 { margin: 0 0 12px; font-size: 17px; }
.board-copy-field { color: var(--c-text-soft); font-size: 12px; }
.board-copy-cards {
  margin: 14px 0;
  padding: 8px;
  border: 1px solid var(--c-line);
  border-radius: 9px;
  max-height: 230px;
  overflow-y: auto;
}
.board-copy-cards legend { color: var(--c-text-soft); font-size: 12px; }
.board-copy-card {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px;
  border-radius: 7px;
  cursor: pointer;
}
.board-copy-card:hover { background: color-mix(in srgb, var(--c-accent) 9%, transparent); }
.board-copy-card span { display: flex; flex-direction: column; min-width: 0; }
.board-copy-card strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.board-copy-card small,
.board-link-results small { color: var(--c-text-soft); font: 11px var(--mono); }
.board-copy-options { font-size: 13px; }
.board-copy-options label { display: flex; gap: 8px; align-items: center; }
.board-copy-note,
.board-copy-status { color: var(--c-text-soft); font-size: 12px; line-height: 1.5; }
.board-copy-error { color: var(--c-danger); font-size: 12px; margin-top: 8px; }
.board-link-results { display: flex; flex-direction: column; gap: 5px; margin: 12px 0; padding: 0; max-height: 320px; overflow-y: auto; list-style: none; }
.board-link-results button { width: 100%; display: flex; justify-content: space-between; gap: 12px; padding: 10px; border: 1px solid var(--c-line); border-radius: 8px; background: var(--c-panel); color: var(--c-text); text-align: left; cursor: pointer; }
.board-link-results button:hover,
.board-link-results button:focus-visible { border-color: var(--c-accent); outline: none; }
.home-folder-dialog {
  width: min(460px, calc(100vw - 32px));
  max-height: calc(100dvh - 48px);
  overflow-y: auto;
  box-sizing: border-box;
}
.home-folder-hint {
  color: var(--c-text-soft);
  font-size: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.home-folder-options {
  margin: 12px 0;
  padding: 8px;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  max-height: 240px;
  overflow-y: auto;
}
.home-folder-options legend { color: var(--c-text-soft); font-size: 12px; }
.home-folder-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 6px;
  font-size: 13px;
  overflow-wrap: anywhere;
  cursor: pointer;
}
.home-folder-option:has(input:checked) { background: color-mix(in srgb, var(--c-accent) 12%, transparent); }
.home-folder-option input { accent-color: var(--c-accent); flex-shrink: 0; }
.home-folder-new { display: flex; flex-direction: column; gap: 6px; font-size: 12px; overflow-wrap: anywhere; }
.attachment-node { padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; font-size: 13px; overflow: auto; height: 100%; box-sizing: border-box; }
.attachment-node p { margin: 0; color: var(--c-text-soft); line-height: 1.5; }
.attachment-node a, .md-import-source a { color: var(--c-accent); }
.attachment-status { font-weight: 600; }
.attachment-button,
.presentation-exit,
.export-dialog-links a {
  min-height: 38px;
  padding: 8px 14px;
  border: 1px solid var(--c-text-soft);
  border-radius: 8px;
  background: var(--c-panel);
  color: var(--c-text);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.attachment-button.is-primary,
.export-dialog-links a.is-primary { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-bg); }
.attachment-button:hover:not(:disabled),
.presentation-exit:hover,
.export-dialog-links a:hover { filter: brightness(1.12); }
.attachment-button:focus-visible,
.presentation-exit:focus-visible,
.export-dialog-links a:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 3px; }
.attachment-button:disabled { opacity: 0.5; cursor: default; }
.attachment-review { width: 100%; border-top: 1px solid var(--c-line); padding-top: 12px; }
.attachment-review-actions {
  position: sticky;
  bottom: -16px;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 24px;
  padding: 16px 0;
  border-top: 1px solid var(--c-line);
  background: var(--c-panel);
  z-index: 1;
}
.attachment-review pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.6 var(--mono); padding: 12px; background: var(--c-bg); border-radius: 8px; }
.attachment-review h4 { margin-bottom: 6px; }
.md-import-source { padding: 6px 12px; font-size: 11px; overflow-wrap: anywhere; color: var(--c-text-soft); border-top: 1px solid var(--c-line); }
@media (max-width: 640px) {
  .home-board { flex-wrap: wrap; }
  .home-board-open { flex-basis: 100%; }
  .home-board-actions { padding: 0 8px 4px; }
}

.pmx-host-app { height: 100%; display: flex; flex-direction: column; }
.pmx-host-app > .app-shell { flex: 1; min-height: 0; height: auto; }
/* Keep context controls clear of the host's floating chat composer. */
.pmx-host-app .context-pin-bar {
  bottom: 16px;
  left: 16px;
  transform: none;
}
/* Guard refusals must remain readable while the full source editor is open. */
.pmx-host-app .attention-toast.attention-tone-remove { z-index: 100100; }
