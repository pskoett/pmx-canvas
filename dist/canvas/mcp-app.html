.board-node, .md-card-preview { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.board-node-content { flex: 1; min-height: 0; overflow: auto; padding: 16px; overflow-wrap: anywhere; }
.board-node-label { color: var(--c-dim); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
.board-node-title { display: block; font-size: 17px; line-height: 1.35; margin-bottom: 6px; }
.board-node-meta { color: var(--c-dim); font-size: 11px; line-height: 1.5; }
.board-node-summary { color: var(--c-text-soft); font-size: 13px; line-height: 1.6; margin: 14px 0; }
.board-node-open { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; width: 100%; padding: 10px 16px; border: 0; border-top: 1px solid var(--c-line); background: var(--c-panel); color: var(--c-accent); font: 500 12px var(--font); text-align: left; cursor: pointer; }
.board-node-open:hover:not(:disabled) { background: var(--c-accent-8); }
.board-node-open:disabled { color: var(--c-dim); cursor: default; }
.md-card-content { flex: 1; min-height: 0; overflow: auto; }
.md-card-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; border-top: 1px solid var(--c-line); padding: 6px 36px 6px 8px; background: var(--c-panel); }
.md-card-actions button { border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--c-dim); padding: 4px 8px; font: 500 11px var(--font); cursor: pointer; }
.md-card-actions button:hover { color: var(--c-text); background: var(--c-accent-8); }
.md-card-actions .md-readme-btn[aria-pressed="true"] { color: var(--c-accent); background: var(--c-accent-8); border-color: var(--c-accent-25); }
.md-card-edit { margin-left: auto; }
.board-node-open:focus-visible, .md-card-actions button:focus-visible { outline: 2px solid var(--c-accent); outline-offset: -2px; }
.canvas-node[data-node-type="markdown"] .node-body,
.canvas-node[data-node-type="board"] .node-body { padding: 0; }
.md-card-content { padding: 10px 14px; }

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body,
#app {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--c-bg);
  color: var(--c-text);
  font: 14px / 1.55 var(--font);
  -webkit-font-smoothing: antialiased;
}

/* Dot-grid canvas background */
#app {
  background-image:
    var(--c-canvas-wash),
    radial-gradient(circle, var(--c-dot-grid) 1px, transparent 1px);
  background-size: auto, 24px 24px;
}

/* Scrollbar styling */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--c-line);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--c-muted);
}

/* Node card shared styles */
.canvas-node {
  position: absolute;
  /* Standard card shell (rail-chrome-v2): node surface, 12px radius, soft
     shadow. Every node kind shares it; the kind shows in the icon color. */
  background: var(--c-panel);
  border: 1px solid var(--c-line);
  border-radius: 12px;
  box-shadow: 0 4px 24px var(--c-shadow);
  display: flex;
  flex-direction: column;
  overflow: visible;
  transition: box-shadow 0.15s ease;
  contain: layout style;
}

/* Clip card content, not the connection handles centered on its border. */
.node-content {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  border-radius: inherit;
  overflow: hidden;
  contain: paint;
}
.group-node > .node-content {
  display: contents;
}

.canvas-node:hover {
  box-shadow: 0 6px 32px var(--c-shadow);
}

.canvas-node.active {
  border-color: var(--c-accent);
  box-shadow: 0 0 0 1px var(--c-accent), 0 6px 32px var(--c-glow-accent);
}

.canvas-node.neighbor {
  border-color: var(--c-accent-40);
  box-shadow: 0 0 0 1px var(--c-accent-30), 0 4px 20px var(--c-accent-15);
  transition: border-color 0.2s, box-shadow 0.2s;
}

/* Spatial search highlighting — canvas lights up as you type in Cmd+K */
.canvas-node.search-match {
  border-color: var(--c-accent);
  box-shadow: 0 0 0 2px var(--c-accent), 0 0 20px var(--c-accent-30), 0 0 40px var(--c-accent-15);
  animation: search-pulse 1.5s ease-in-out infinite;
}
@keyframes search-pulse {
  0%, 100% { box-shadow: 0 0 0 2px var(--c-accent), 0 0 20px var(--c-accent-30), 0 0 40px var(--c-accent-15); }
  50%      { box-shadow: 0 0 0 2px var(--c-accent), 0 0 30px var(--c-accent-40), 0 0 60px var(--c-accent-25); }
}
.canvas-node.search-dimmed {
  opacity: 0.25;
  transition: opacity 0.2s;
}

/* ── Connection port handles (drag-to-connect) ───────────── */
.node-port {
  position: absolute;
  /* The visible dot stays compact; its grab area stays usable at every zoom. */
  width: calc(32px * var(--node-port-scale, 1));
  height: calc(32px * var(--node-port-scale, 1));
  display: grid;
  place-items: center;
  opacity: 0;
  cursor: crosshair;
  z-index: 10;
  touch-action: none;
  transition: opacity 0.15s;
  pointer-events: auto;
}
.node-port::after {
  content: '';
  width: calc(6px * var(--node-port-scale, 1));
  height: calc(6px * var(--node-port-scale, 1));
  border-radius: 50%;
  background: var(--c-accent);
  border: calc(2px * var(--node-port-scale, 1)) solid var(--c-panel);
  box-shadow: 0 0 0 calc(1px * var(--node-port-scale, 1)) var(--c-accent);
}
.canvas-node:hover .node-port,
.canvas-node.selected .node-port,
.canvas-node:focus-within .node-port {
  opacity: 1;
}
.node-port:hover::after {
  background: var(--c-accent-hover);
}
/* Bias vertical grab areas outward so they do not steal title/footer clicks. */
.node-port-top    { top: 0; left: 50%; transform: translate(-50%, -75%); }
.node-port-bottom { bottom: 0; left: 50%; transform: translate(-50%, 75%); }
.node-port-top::after { transform: translateY(calc(8px * var(--node-port-scale, 1))); }
.node-port-bottom::after { transform: translateY(calc(-8px * var(--node-port-scale, 1))); }
.node-port-left   { left: 0; top: 50%; transform: translate(-50%, -50%); }
.node-port-right  { right: 0; top: 50%; transform: translate(50%, -50%); }

.canvas-node .node-titlebar {
  display: flex;
  align-items: center;
  gap: calc(8px * var(--node-chrome-scale, 1));
  padding: calc(7px * var(--node-chrome-scale, 1)) calc(12px * var(--node-chrome-scale, 1));
  background: var(--c-panel-overlay);
  border-bottom: 1px solid var(--c-line);
  cursor: grab;
  user-select: none;
  flex-shrink: 0;
}

.canvas-node .node-titlebar:active {
  cursor: grabbing;
}

.canvas-node .node-title {
  font-size: calc(12px * var(--node-chrome-scale, 1));
  font-weight: 600;
  color: var(--c-text-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  /* The name is the one thing that must survive a cramped title bar. Everything
     else in the bar is flex-shrink: 0, so without a floor the title absorbed all
     the pressure and collapsed to an ellipsis on narrow nodes. */
  min-width: 9ch;
  min-width: 0;
}

.canvas-node .node-type-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: calc(14px * var(--node-chrome-scale, 1));
  height: calc(14px * var(--node-chrome-scale, 1));
  color: var(--kind-accent, var(--c-accent));
  flex-shrink: 0;
}

/* Node kind accents (rail-chrome-v2): the icon carries the kind. */
.canvas-node[data-node-type='image'],
.canvas-node[data-node-type='mermaid'] {
  --kind-accent: var(--c-warn);
}
.canvas-node[data-node-type='webpage'],
.canvas-node[data-node-type='status'],
.canvas-node[data-node-type='trace'] {
  --kind-accent: var(--c-ok);
}
.canvas-node[data-node-type='context'],
.canvas-node[data-node-type='prompt'],
.canvas-node[data-node-type='response'] {
  --kind-accent: var(--c-purple);
}

.canvas-node .node-type-badge {
  font-size: calc(10px * var(--node-chrome-scale, 1));
  padding: calc(1px * var(--node-chrome-scale, 1)) calc(6px * var(--node-chrome-scale, 1));
  border-radius: calc(4px * var(--node-chrome-scale, 1));
  background: var(--c-accent-12);
  color: var(--c-accent);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

.canvas-node .node-ax-status {
  /* A long status ("in-progress") must not push the node's NAME out of the bar;
     the pill is a glance-level cue, the name is the identity. */
  max-width: 11ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex-shrink: 1;
  font-size: calc(9px * var(--node-chrome-scale, 1));
  padding: calc(1px * var(--node-chrome-scale, 1)) calc(6px * var(--node-chrome-scale, 1));
  border-radius: calc(4px * var(--node-chrome-scale, 1));
  background: var(--c-panel-overlay);
  color: var(--c-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

.canvas-node .node-ax-status-in-progress {
  color: var(--c-accent);
}

.canvas-node .node-ax-status-done {
  color: var(--c-ok);
}

.canvas-node .node-ax-status-blocked {
  color: var(--c-warn);
}

.canvas-node .node-controls {
  display: flex;
  align-items: center;
  gap: calc(4px * var(--node-chrome-scale, 1));
  flex-shrink: 0;
}

.canvas-node .node-controls button {
  background: none;
  border: none;
  color: var(--c-dim);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: calc(22px * var(--node-chrome-scale, 1));
  min-height: calc(22px * var(--node-chrome-scale, 1));
  padding: calc(2px * var(--node-chrome-scale, 1)) calc(4px * var(--node-chrome-scale, 1));
  font-size: calc(14px * var(--node-chrome-scale, 1));
  line-height: 1;
  border-radius: calc(3px * var(--node-chrome-scale, 1));
}

.canvas-node .node-controls button svg {
  width: 1em;
  height: 1em;
}

.canvas-node .node-controls button:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
}

.canvas-node .node-body {
  flex: 1;
  overflow: auto;
  padding: 10px 14px;
  min-height: 0;
  font-size: 11px;
  line-height: 1.6;
  color: var(--c-text-soft);
}

/* Markdown rendered content inside nodes */
.canvas-node .node-body h1,
.canvas-node .node-body h2,
.canvas-node .node-body h3 {
  margin: 0.6em 0 0.3em;
  color: var(--c-text);
}

.canvas-node .node-body h1 {
  font-size: 1.4em;
}
.canvas-node .node-body h2 {
  font-size: 1.15em;
}
.canvas-node .node-body h3 {
  font-size: 1em;
}

.canvas-node .node-body p {
  margin: 0.4em 0;
  color: var(--c-muted);
}

/* GFM task lists: custom-drawn checkboxes — native inputs are an 11px target
   at typical zoom and render inconsistently (or not at all) in embedding
   apps — and no double marker (• plus box) on task rows. */
.canvas-node .node-body li:has(> input[type='checkbox']),
.md-reader-content li:has(> input[type='checkbox']) {
  list-style: none;
  /* Reclaim the bullet gutter, then indent the whole item past the box — the
     box sits OUT of the text flow so wrapped lines align under the first. */
  margin-left: -1.3em;
  padding-left: 1.65em;
  position: relative;
}
.canvas-node .node-body li > input[type='checkbox'],
.md-reader-content li > input[type='checkbox'] {
  appearance: none;
  -webkit-appearance: none;
  position: absolute;
  left: 0;
  top: 0.22em;
  width: 15px;
  height: 15px;
  margin: 0;
  border: 1.5px solid var(--c-muted);
  border-radius: 4px;
  background: var(--c-panel);
  cursor: pointer;
  /* Embedding webviews (Copilot app) force color schemes on form controls —
     this box is fully custom-drawn, keep its colors ours. */
  forced-color-adjust: none;
  color-scheme: light;
}
.canvas-node .node-body li > input[type='checkbox']:hover,
.md-reader-content li > input[type='checkbox']:hover {
  border-color: var(--c-accent);
}
.canvas-node .node-body li > input[type='checkbox']:checked,
.md-reader-content li > input[type='checkbox']:checked {
  border-color: var(--c-accent);
  background-color: var(--c-accent);
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='8'%3E%3Cpath d='M1 4l2.6 2.6L9 1' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: center;
}

/* Hanging indent: with `inside`, a wrapped line falls back to the card edge
   under the marker instead of aligning with its own first line. */
.canvas-node .node-body ul,
.canvas-node .node-body ol {
  margin: 0.4em 0;
  padding-left: 1.3em;
  list-style-position: outside;
}

.canvas-node .node-body li {
  margin: 0.2em 0;
  padding-left: 0.1em;
}

.canvas-node .node-body a {
  color: var(--c-accent);
  text-decoration: none;
}
.canvas-node .node-body a:hover {
  text-decoration: underline;
}

.canvas-node .node-body code {
  font-family: var(--mono);
  font-size: 0.9em;
  background: var(--c-surface-hover);
  padding: 2px 5px;
  border-radius: 4px;
}

.canvas-node .node-body pre {
  background: var(--c-shadow);
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 0.5em 0;
}

.canvas-node .node-body pre code {
  background: none;
  padding: 0;
}

.canvas-node .node-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 0.5em 0;
}

.canvas-node .node-body th,
.canvas-node .node-body td {
  border: 1px solid var(--c-line);
  padding: 6px 10px;
  text-align: left;
  font-size: 0.9em;
}

.canvas-node .node-body th {
  background: var(--c-surface-th);
  font-weight: 600;
}

/* ── App shell: rail + top bar + canvas region (rail-chrome-v2) ── */
.app-shell {
  display: flex;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--c-bg);
}

.tool-rail {
  width: 52px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 0;
  background: var(--c-panel-soft);
  border-right: 1px solid var(--c-line);
  overflow-y: auto;
  scrollbar-width: none;
  /* The rail is a stacking context: its popovers can only win against the
     canvas region's overlays (annotation capture layer at 9996) if the rail
     ITSELF stacks above them — a child's z-index never escapes this context. */
  z-index: 9999;
}
.tool-rail::-webkit-scrollbar {
  display: none;
}

.rail-brand {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  color: var(--c-accent);
  flex-shrink: 0;
}

.rail-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: none;
  color: var(--c-muted);
  cursor: pointer;
  flex-shrink: 0;
}
.rail-btn svg {
  display: block;
}
.rail-btn:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
}
.rail-btn.active {
  background: var(--c-accent-10);
  border-color: var(--c-accent-25);
  color: var(--c-accent);
}
.rail-btn.active:hover {
  background: var(--c-accent-15, var(--c-accent-10));
}

.rail-divider {
  width: 24px;
  height: 1px;
  background: var(--c-line);
  flex-shrink: 0;
  margin: 3px 0;
}

.rail-spacer {
  flex: 1;
  min-height: 8px;
}

.app-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.top-bar {
  height: var(--hud-bar-height);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: color-mix(in srgb, var(--c-panel-soft) 92%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--c-line);
  /* NOT overflow:hidden — the BarHint tooltips hang below the bar and were
     clipped invisible for everyone (the e2e asserted opacity, which cannot
     see ancestor clipping). Children ellipsize themselves; the narrow-screen
     collapse is media-query display, not clipping. overflow-x: clip is the
     one safe axis (visible/clip is the valid mixed pair): tooltips still
     hang below, but bar content can never paint over the session panel
     again (0.5.1 user feedback — the agent-chip flood pushed the zoom
     cluster out of the bar). */
  overflow-x: clip;
  min-width: 0;
  z-index: 9998;
}
/* CHIP BarHint anchors must pass shrink through to their chip (flex min-auto
   sizing) or an unshrinkable anchor re-creates the overflow. Chip anchors
   ONLY — a blanket min-width: 0 crushed the zoom buttons to slivers. */
.top-bar .toolbar-tooltip-anchor:has(.agent-chip) {
  min-width: 0;
}

.top-bar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 60px;
  flex-shrink: 1;
}

.top-bar-meta {
  font: 11px var(--mono);
  color: var(--c-dim);
  white-space: nowrap;
  flex-shrink: 0;
}

.top-bar-spacer {
  flex: 1;
  min-width: 0;
}

.top-bar-sep {
  width: 1px;
  height: 20px;
  background: var(--c-line);
  flex-shrink: 0;
}

.top-bar-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 8px;
  background: none;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--c-muted);
  cursor: pointer;
  flex-shrink: 0;
}
.top-bar-btn svg {
  display: block;
}
.top-bar-btn:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
  border-color: var(--c-line);
}

.top-bar-zoom-label {
  min-width: 38px;
  text-align: center;
  font: 11px var(--mono);
  color: var(--c-muted);
  background: none;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  padding: 6px 4px;
  cursor: pointer;
  flex-shrink: 0;
}
.top-bar-zoom-label:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
}

.canvas-region {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

/* ── Agent presence (rail-chrome-v2 phase 3) ────────────────────
   Every surface below mounts only while a session is attached. Phase colors
   are tokens so all nine themes agree: thinking=purple, tooling=accent,
   waiting=warn, idle=dim. */
.agent-chip,
.agent-cursor,
.minimap-presence {
  --presence-color: var(--c-dim);
}
.agent-chip.phase-thinking,
.agent-cursor.phase-thinking,
.minimap-presence.phase-thinking {
  --presence-color: var(--c-purple);
}
.agent-chip.phase-tooling,
.agent-cursor.phase-tooling,
.minimap-presence.phase-tooling {
  --presence-color: var(--c-accent);
}
.agent-chip.phase-waiting-approval,
.agent-cursor.phase-waiting-approval,
.minimap-presence.phase-waiting-approval {
  --presence-color: var(--c-warn);
}

/* Top-bar chip */
.agent-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--presence-color) 35%, transparent);
  background: color-mix(in srgb, var(--presence-color) 12%, transparent);
  color: var(--presence-color);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  /* Rigid: the chip never shrinks and never lies about its min size (a
     min-width: 0 here let BarHint anchors collapse under their chips, and
     neighboring chips painted over each other). The .agent-chips wrapper is
     the ONE squeeze point — it clips whole trailing chips at its edge. */
  flex-shrink: 0;
  max-width: 280px;
}
/* Many-agent bar (0.5.1 user feedback): the visible chips sit in ONE
   clipping flex wrapper. Chips keep their natural readable width; when the
   bar is overconstrained the WRAPPER shrinks and clips at its edge, so chip
   content can never shove or paint over the census chip, the context meter,
   or the zoom cluster (16 unshrinkable chips used to push the zoom controls
   out of the bar and over the session panel). */
.agent-chips {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  overflow: hidden;
}
/* Rigid anchors: nested-flex min-content lets a BarHint anchor collapse
   under its chip (ellipsizing spans zero the chip's min-content), and the
   chip then paints into the next anchor. Only the wrapper above may give. */
.agent-chips .toolbar-tooltip-anchor {
  flex-shrink: 0;
}
.agent-chip.phase-idle {
  background: none;
  border-color: var(--c-line);
}
/* The census chip is the "how many" answer — it never compresses away. Its
   BarHint anchor must hold width too: a shrinking anchor around an
   unshrinkable chip lets the chip paint over the next bar item. */
.agent-chip-more {
  flex-shrink: 0;
}
.top-bar .toolbar-tooltip-anchor:has(.agent-chip-more) {
  flex-shrink: 0;
  min-width: max-content;
}
.agent-chip-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--presence-color);
  flex-shrink: 0;
}
.agent-chip.phase-thinking .agent-chip-dot,
.agent-chip.phase-tooling .agent-chip-dot {
  animation: presence-pulse 1.4s ease-in-out infinite;
}
.agent-chip-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.agent-chip-who {
  font: 10px var(--mono);
  font-weight: 400;
  color: var(--c-muted);
  white-space: nowrap;
  /* Leaf-level truncation: a compressed chip must ellipsize the agent name,
     never paint it past the pill (0.5.1 user feedback, many-agent bar). */
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

/* On-canvas cursor + phase chip (world layer; counter-scaled inner) */
.agent-presence-layer {
  display: contents;
}
.agent-cursor {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 9000;
  pointer-events: none;
  transition:
    transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
    opacity 320ms ease;
  color: var(--presence-color);
}
.agent-cursor.is-worker {
  opacity: 0.85;
}
.agent-cursor.is-worker .agent-cursor-glyph {
  transform: scale(0.75);
  transform-origin: top left;
}
.agent-cursor.is-worker .agent-cursor-chip {
  font-size: 9px;
  padding: 1px 6px;
}
/* Parked idle cursors leave the board (user feedback, 0.5.1 cycle): with many agents
   attached, a wall of parked "Idle" pills covers real node content. The
   element stays MOUNTED — counts, twin-merge, and cursor-follow logic are
   untouched, and visibility (not display) keeps its layout box so position
   polls still resolve — but it paints nothing. An explicitly reported cursor
   remains visible even while idle so cursor-only movement cannot disappear. */
.agent-cursor.phase-idle:not(.has-explicit-cursor) {
  opacity: 0;
  visibility: hidden;
  transition:
    transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
    opacity 320ms ease,
    visibility 0s linear 320ms;
}
.agent-chip-workers {
  margin-left: 4px;
  padding: 0 5px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--c-accent) 16%, transparent);
  color: var(--c-accent);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

/* End THIS session — each chip carries its own ×, so a two-agent board can
   end one writer without hunting for it in the session panel. */
.agent-chip-end {
  margin-left: 2px;
  padding: 0 3px;
  border: none;
  background: none;
  color: var(--c-muted);
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  border-radius: 6px;
}

.agent-chip-end:hover {
  color: var(--c-danger);
  background: color-mix(in srgb, currentColor 12%, transparent);
}

.agent-cursor-glyph path {
  fill: var(--identity-color, currentColor);
}
.agent-cursor-chip {
  border-left: 3px solid var(--identity-color, transparent);
}
.agent-chip {
  border-left: 3px solid var(--identity-color, transparent);
}
.minimap-presence {
  background: var(--identity-color, var(--presence-color));
}

.agent-cursor.is-external {
  opacity: 0.8;
}
.agent-cursor.is-external .agent-cursor-chip {
  border-style: dashed;
}

.agent-cursor-inner {
  position: relative;
  transform-origin: 0 0;
}
.agent-cursor-glyph {
  display: block;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
}
.agent-cursor-chip {
  position: absolute;
  left: 14px;
  top: 18px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--presence-color) 35%, transparent);
  background: color-mix(in srgb, var(--c-panel) 92%, var(--presence-color) 8%);
  color: var(--presence-color);
  font-size: 10.5px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
}
.agent-cursor-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--presence-color);
}
.agent-cursor.phase-thinking .agent-cursor-dot,
.agent-cursor.phase-tooling .agent-cursor-dot {
  animation: presence-pulse 1.4s ease-in-out infinite;
}
.agent-cursor-who {
  font: 9.5px var(--mono);
  font-weight: 400;
  color: var(--c-muted);
}

/* Node shimmer: the node an attached agent is mutating right now */
.canvas-node.agent-mutating {
  border-color: color-mix(in srgb, var(--c-accent) 45%, transparent) !important;
  background-image: linear-gradient(
    100deg,
    transparent 20%,
    color-mix(in srgb, var(--c-accent) 13%, transparent) 50%,
    transparent 80%
  );
  background-size: 200% 100%;
  animation: presence-shimmer 1.6s linear infinite;
}

@keyframes presence-pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.45;
  }
}
@keyframes presence-shimmer {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}

/* Reduced motion: keep every static color state, drop the motion. */
@media (prefers-reduced-motion: reduce) {
  .agent-cursor {
    transition: none;
  }
  .agent-chip-dot,
  .agent-cursor-dot,
  .canvas-node.agent-mutating {
    animation: none;
  }
  .canvas-node.agent-mutating {
    background-image: none;
  }
}

/* ── Session panel (rail-chrome-v2 phase 4) ─────────────────────
   Right sibling of the centre column while a session is attached. Below
   1180px it becomes a fixed overlay drawer and the canvas reclaims its width. */
.session-panel {
  width: 320px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-panel-soft);
  border-left: 1px solid var(--c-line);
  min-height: 0;
  z-index: 9997;
  animation: session-panel-in 180ms ease;
}
.session-panel.is-collapsed {
  width: 40px;
  align-items: center;
  padding-top: 10px;
  gap: 10px;
}
.session-collapsed-label {
  writing-mode: vertical-rl;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-dim);
}
.session-collapsed-live {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font: 9px var(--mono);
  color: var(--c-dim);
}
.session-collapsed-live .session-live-dot {
  background: var(--c-ok);
}

.session-panel-header {
  height: var(--hud-bar-height);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px 0 16px;
  border-bottom: 1px solid var(--c-line);
}
.session-panel-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-text);
}
.session-live {
  --presence-color: var(--c-dim);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font: 10px var(--mono);
  color: var(--c-muted);
}
.session-live.phase-thinking {
  --presence-color: var(--c-purple);
}
.session-live.phase-tooling {
  --presence-color: var(--c-accent);
}
.session-live.phase-waiting-approval {
  --presence-color: var(--c-warn);
}
.session-live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--presence-color);
}
.session-live.phase-thinking .session-live-dot,
.session-live.phase-tooling .session-live-dot {
  animation: presence-pulse 1.4s ease-in-out infinite;
}
.session-collapse {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  width: 26px;
  height: 26px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  color: var(--c-muted);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
}
.session-collapse:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
}

.session-panel-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.session-section-title {
  margin: 0 0 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-dim);
}
.session-empty {
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--c-dim);
}
.session-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* Work items + gates */
.session-item {
  --glyph: var(--c-dim);
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  background: color-mix(in srgb, var(--c-panel) 70%, transparent);
}
.session-item.status-running {
  --glyph: var(--c-accent);
}
.session-item.status-awaiting {
  --glyph: var(--c-warn);
}
.session-item.status-done {
  --glyph: var(--c-ok);
}
.session-item.status-vetoed {
  --glyph: var(--c-danger);
}
.session-glyph {
  width: 7px;
  height: 7px;
  margin-top: 5px;
  border-radius: 50%;
  background: var(--glyph);
  flex-shrink: 0;
}
.session-item.status-running .session-glyph {
  animation: presence-pulse 1.4s ease-in-out infinite;
}
.session-item-main {
  flex: 1;
  min-width: 0;
}
.session-item-title {
  display: block;
  width: 100%;
  padding: 0;
  border: none;
  background: none;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--c-text-soft);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-item-title:disabled {
  cursor: default;
}
.session-item-title:not(:disabled):hover {
  color: var(--c-text);
}
.session-item-detail {
  margin-top: 2px;
  font-size: 10.5px;
  line-height: 1.45;
  color: var(--c-muted);
}
.session-item-status {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--glyph);
  flex-shrink: 0;
  margin-top: 3px;
}
.session-item-time {
  font: 9px var(--mono);
  color: var(--c-dim);
  flex-shrink: 0;
  margin-top: 4px;
}
.session-gate {
  border-color: color-mix(in srgb, var(--c-warn) 35%, transparent);
  background: color-mix(in srgb, var(--c-warn) 6%, transparent);
}
.session-gate-ttl {
  margin-top: 4px;
  font: 10px var(--mono);
  color: var(--c-warn);
}
.session-gate-held {
  opacity: 0.85;
}
.session-gate-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.session-gate-approve,
.session-gate-reject {
  padding: 4px 12px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.session-gate-approve {
  border: 1px solid transparent;
  background: color-mix(in srgb, var(--c-ok) 15%, transparent);
  color: var(--c-ok);
}
.session-gate-approve:hover {
  background: color-mix(in srgb, var(--c-ok) 25%, transparent);
}
.session-gate-reject {
  border: 1px solid var(--c-line);
  background: none;
  color: var(--c-muted);
}
.session-gate-reject:hover {
  border-color: color-mix(in srgb, var(--c-danger) 45%, transparent);
  color: var(--c-danger);
}
.session-gate-approve:disabled,
.session-gate-reject:disabled {
  opacity: 0.6;
  cursor: progress;
}

/* Timeline */
/* One row, always: compact chips, no wrapping, and the row runs full-bleed
   across the panel's inner padding so all six fit. If a theme/locale ever
   makes them wider still, the row pans horizontally instead of stacking. */
.session-section-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 0;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
}
.session-work-summary {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 10px/1 var(--mono);
  color: var(--c-muted);
}
.session-work-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c-ok);
  animation: session-work-pulse 1.6s ease-in-out infinite;
}
@keyframes session-work-pulse {
  0%,
  100% {
    opacity: 0.45;
    transform: scale(0.85);
  }
  50% {
    opacity: 1;
    transform: scale(1);
  }
}
.session-section-chevron {
  display: inline-flex;
  flex-shrink: 0;
  color: var(--c-muted);
  transition: transform 0.15s ease;
}
.session-section-chevron.is-open {
  transform: rotate(90deg);
}

.session-undo-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--c-line);
  background: var(--c-accent-8);
}
.session-undo-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  color: var(--c-text-soft);
}
.session-undo-btn {
  flex-shrink: 0;
  padding: 3px 10px;
  border: 1px solid var(--c-accent-25);
  border-radius: 999px;
  background: none;
  color: var(--c-accent);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.session-undo-btn:hover {
  background: var(--c-accent-10);
}

.session-timeline-filters {
  display: flex;
  flex-wrap: nowrap;
  gap: 1px;
  margin: 2px -12px 8px;
  /* Compact panels (Amp portal, 0.5.0 report B): six chips overflowed the
     row by 11px — tighter inset + chip padding buys ~16px back. */
  padding: 0 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.session-timeline-filters::-webkit-scrollbar {
  display: none;
}

/* The hovered/active chip's one-line meaning — rendered in flow because an
   anchored tooltip would clip against the filter row's own scroll container. */
.session-timeline-hint {
  margin: -4px 0 8px;
  font-size: 10px;
  line-height: 1.35;
  color: var(--c-muted);
  min-height: 14px;
}
.session-timeline-filters .activity-filter {
  flex-shrink: 0;
  padding: 2px 3px;
}

.session-timeline-row {
  --tone: var(--c-muted);
  display: flex;
  gap: 8px;
  padding: 4px 2px;
}
.session-timeline-row.tone-accent {
  --tone: var(--c-accent);
}
.session-timeline-row.tone-ok {
  --tone: var(--c-ok);
}
.session-timeline-row.tone-warn {
  --tone: var(--c-warn);
}
.session-timeline-row.tone-danger {
  --tone: var(--c-danger);
}
.session-timeline-row.tone-purple {
  --tone: var(--c-purple);
}
.session-timeline-dot {
  width: 6px;
  height: 6px;
  margin-top: 5px;
  border-radius: 50%;
  background: var(--tone);
  flex-shrink: 0;
}
.session-timeline-main {
  flex: 1;
  min-width: 0;
}
.session-timeline-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.session-timeline-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--tone);
}
/* Row writer in its identity hue — multi-assistant boards need every row to
   answer "who wrote this" without opening anything. */
.session-timeline-who {
  font-size: 10px;
  font-weight: 600;
  color: var(--identity-color, var(--c-muted));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 40%;
}
.session-timeline-undo {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 5px;
  padding: 4px 12px;
  border: 1px solid var(--c-accent);
  border-radius: 999px;
  background: var(--c-accent-10);
  color: var(--c-accent);
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  animation: session-work-pulse 1.6s ease-in-out 2;
}
.session-timeline-undo:hover {
  background: var(--c-accent);
  color: var(--c-bg);
}
.session-timeline-undone {
  margin-top: 2px;
  font: 9px var(--mono);
  color: var(--c-dim);
}
.session-timeline-body {
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--c-text-soft);
  overflow-wrap: anywhere;
}

/* Scope row (session panel) */
.session-scope {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px 8px 16px;
  border-bottom: 1px solid var(--c-line);
  font-size: 10.5px;
  color: var(--c-muted);
}
.session-scope.is-fenced {
  background: color-mix(in srgb, var(--c-purple) 8%, transparent);
  color: var(--c-text-soft);
}
.session-scope-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c-dim);
  flex-shrink: 0;
}
.session-scope.is-fenced .session-scope-dot {
  background: var(--c-purple);
}
.session-scope-text {
  flex: 1;
  min-width: 0;
}
.session-scope-text strong {
  color: var(--c-purple);
}
.session-scope-action {
  padding: 3px 9px;
  border-radius: 6px;
  border: 1px solid var(--c-line);
  background: none;
  color: var(--c-muted);
  font-size: 10.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.session-scope-action:hover:not(:disabled) {
  border-color: color-mix(in srgb, var(--c-purple) 45%, transparent);
  color: var(--c-purple);
}
.session-scope-action:disabled {
  opacity: 0.5;
  cursor: default;
}

/* Scope fence on the canvas (world layer) */
.scope-fence {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 1;
  pointer-events: none;
  border: 1.5px dashed color-mix(in srgb, var(--c-purple) 40%, transparent);
  border-radius: 16px;
  background: color-mix(in srgb, var(--c-purple) 3%, transparent);
}
.scope-fence-pill {
  position: absolute;
  left: 14px;
  transform-origin: 0 50%;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--c-purple) 35%, transparent);
  background: color-mix(in srgb, var(--c-panel) 92%, var(--c-purple) 8%);
  color: var(--c-purple);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.scope-fence-pill-top {
  top: -11px;
}
.scope-fence-pill-bottom {
  bottom: -11px;
  color: var(--c-muted);
  font-weight: 500;
  letter-spacing: 0;
}

/* ── Command bar (rail-chrome-v2 phase 5) ─────────────────────
   The human's steering surface while a session is attached: the design's
   floating composer, centered at the bottom of the canvas region, with the
   pinned-context chips floating above it. */
.command-bar {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  width: min(560px, calc(100% - 48px));
  z-index: 65;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.command-bar-chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.command-bar-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 240px;
  padding: 2px 5px 2px 9px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--c-warn) 35%, transparent);
  background: color-mix(in srgb, var(--c-warn) 12%, transparent);
  color: var(--c-warn);
  font-size: 10px;
  font-weight: 600;
}
.command-bar-chip-glyph {
  font-size: 10px;
  line-height: 1;
}
.command-bar-chip-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.command-bar-chip-unpin {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 50%;
  background: none;
  color: var(--c-warn);
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  opacity: 0.7;
}
.command-bar-chip-unpin:hover {
  opacity: 1;
  background: color-mix(in srgb, var(--c-warn) 25%, transparent);
}
.command-bar-chips-note {
  font-size: 10px;
  color: var(--c-dim);
}
.command-bar-composer {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--c-line);
  background: color-mix(in srgb, var(--c-panel) 95%, transparent);
  backdrop-filter: blur(16px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
}
.command-bar-target {
  max-width: 148px;
  flex-shrink: 0;
}
.choice-menu {
  position: relative;
  min-width: 0;
}
.choice-menu-trigger {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 36px;
  padding: 8px 10px;
  border: 1px solid color-mix(in srgb, var(--c-line) 65%, var(--c-muted));
  border-radius: 8px;
  background: var(--c-panel-overlay);
  color: var(--c-text);
  font: 12px/1.35 var(--font);
  cursor: pointer;
}
.choice-menu-trigger > span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.choice-menu-trigger svg { flex-shrink: 0; }
.choice-menu-trigger:hover,
.choice-menu-trigger[aria-expanded='true'] { border-color: var(--c-accent); }
.choice-menu-trigger:focus-visible,
.choice-menu-options button:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
}
.toolbar-menu.choice-menu-options {
  top: calc(100% + 6px);
  left: 0;
  right: auto;
  min-width: 100%;
  width: max-content;
  max-width: min(320px, calc(100vw - 64px));
  max-height: min(280px, 40vh);
  overflow-y: auto;
  z-index: 20;
}
.toolbar-menu.choice-menu-options.opens-above {
  top: auto;
  bottom: calc(100% + 6px);
}
.command-bar-target.choice-menu {
  position: static;
}
.command-bar-target .choice-menu-options {
  /* Anchor to the composer, not its inset trigger, to clear the session rail. */
  min-width: min(200px, 100%);
  max-width: 100%;
}
.choice-menu-options .toolbar-menu-item {
  min-height: 36px;
  white-space: normal;
  overflow-wrap: anywhere;
}
.choice-menu-options button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.command-bar-icon {
  flex-shrink: 0;
  color: var(--c-purple);
}
.command-bar-input {
  flex: 1;
  min-width: 0;
  padding: 0;
  border: none;
  outline: none;
  background: none;
  color: var(--c-text);
  font: 13px var(--font);
}
.command-bar-input::placeholder {
  color: var(--c-dim);
}
.command-bar-composer:focus-within {
  border-color: color-mix(in srgb, var(--c-accent) 45%, var(--c-line));
}
.command-bar-send {
  flex-shrink: 0;
  padding: 5px 14px;
  border-radius: 7px;
  border: none;
  background: var(--c-accent);
  color: var(--c-bg);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.command-bar-send:hover:not(:disabled) {
  background: color-mix(in srgb, var(--c-accent) 80%, white);
}
.command-bar-send:disabled {
  opacity: 0.45;
  cursor: default;
}

/* Context-budget meter in the top bar (session-only) */
.context-budget {
  --tone: var(--c-ok);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.context-budget.tone-warn {
  --tone: var(--c-warn);
}
.context-budget.tone-danger {
  --tone: var(--c-danger);
}
.context-budget-caption {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--c-muted);
}
.context-budget-track {
  display: block;
  width: 72px;
  height: 5px;
  border-radius: 3px;
  background: var(--c-line);
  overflow: hidden;
}
.context-budget-fill {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--c-accent), var(--c-warn));
  transition: width 180ms ease;
}
.context-budget.tone-warn .context-budget-fill,
.context-budget.tone-danger .context-budget-fill {
  background: var(--tone);
}
.context-budget-label {
  font: 11px var(--mono);
  color: var(--c-text-soft);
  min-width: 30px;
  text-align: right;
}

/* ── External Steering (rail-chrome-v2 phase 6) ───────────────
   External writers, no session: a passive top-bar indicator, the activity
   feed popover under it, and the connected-writers sheet. Quiet otherwise. */
.writer-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1.5px solid var(--c-panel-soft);
  color: var(--c-bg);
  font-size: 8.5px;
  font-weight: 700;
  flex-shrink: 0;
}
.external-indicator {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px 4px 6px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--c-purple) 35%, transparent);
  background: color-mix(in srgb, var(--c-purple) 8%, transparent);
  color: var(--c-purple);
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  font: inherit;
}
.external-indicator:hover,
.external-indicator[aria-expanded='true'] {
  background: color-mix(in srgb, var(--c-purple) 15%, transparent);
}
.external-indicator-avatars {
  display: inline-flex;
  align-items: center;
}
.external-indicator-avatars .writer-avatar + .writer-avatar {
  margin-left: -6px;
}
.external-indicator-label {
  font-size: 11px;
  font-weight: 600;
}
.external-indicator-ops {
  font: 10px var(--mono);
  color: var(--c-muted);
}
.external-indicator-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c-purple);
  flex-shrink: 0;
  animation: presence-pulse 1.4s ease-in-out infinite;
}

.activity-feed {
  position: absolute;
  top: 10px;
  right: 14px;
  width: min(304px, calc(100% - 28px));
  max-height: calc(100% - 20px);
  display: flex;
  flex-direction: column;
  background: var(--c-panel);
  border: 1px solid color-mix(in srgb, var(--c-purple) 30%, transparent);
  border-radius: 10px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  /* Popover-level like the rail menus: above the minimap, below the rail. */
  z-index: 9999;
  overflow: hidden;
}
.activity-feed-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 13px;
  border-bottom: 1px solid var(--c-line);
  background: color-mix(in srgb, var(--c-bg) 60%, transparent);
}
.activity-feed-titles {
  flex: 1;
  min-width: 0;
}
.activity-feed-title {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-text);
}
.activity-feed-sub {
  font: 9px var(--mono);
  color: var(--c-dim);
}
.activity-feed-close {
  background: none;
  border: none;
  color: var(--c-muted);
  font-size: 14px;
  cursor: pointer;
  padding: 0 2px;
}
.activity-feed-close:hover {
  color: var(--c-text);
}
.activity-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--c-line);
}
.activity-filter {
  --writer: var(--c-purple);
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--c-line);
  background: none;
  color: var(--c-muted);
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
}
.activity-filter.is-active {
  border-color: color-mix(in srgb, var(--writer) 45%, transparent);
  background: color-mix(in srgb, var(--writer) 14%, transparent);
  color: var(--writer);
}
.activity-rows {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  min-height: 0;
}
.activity-row {
  display: flex;
  gap: 9px;
  padding: 9px 13px;
  border-bottom: 1px solid var(--c-line);
}
.activity-row:last-child {
  border-bottom: none;
}
.activity-row.is-pending {
  background: color-mix(in srgb, var(--c-purple) 5%, transparent);
}
.activity-glyph {
  flex-shrink: 0;
  width: 13px;
  margin-top: 1px;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.3;
}
.activity-glyph.tone-ok {
  color: var(--c-ok);
}
.activity-glyph.tone-danger {
  color: var(--c-danger);
}
.activity-glyph.tone-accent {
  color: var(--c-accent);
}
.activity-glyph.tone-purple {
  color: var(--c-purple);
}
.activity-main {
  flex: 1;
  min-width: 0;
}
.activity-text {
  font-size: 11px;
  color: var(--c-text-soft);
  overflow-wrap: anywhere;
}
.activity-meta {
  font-size: 10px;
  line-height: 1.45;
  color: var(--c-muted);
}
.activity-writer {
  font: 8.5px var(--mono);
}
.activity-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.activity-veto {
  padding: 3px 10px;
  border-radius: 7px;
  background: none;
  border: 1px solid color-mix(in srgb, var(--c-danger) 40%, transparent);
  color: var(--c-danger);
  font-size: 10.5px;
  font-weight: 600;
  cursor: pointer;
}
.activity-veto:hover {
  background: color-mix(in srgb, var(--c-danger) 10%, transparent);
}
.activity-hint,
.activity-age {
  font: 9px var(--mono);
  color: var(--c-dim);
  flex-shrink: 0;
}
.activity-empty {
  padding: 14px 13px;
  font-size: 11px;
  color: var(--c-dim);
}
.activity-feed-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 13px;
  border-top: 1px solid var(--c-line);
  background: color-mix(in srgb, var(--c-bg) 50%, transparent);
}
.activity-feed-note {
  flex: 1;
  font-size: 10px;
  color: var(--c-dim);
}
.activity-feed-link {
  background: none;
  border: none;
  padding: 0;
  color: var(--c-muted);
  font-size: 10.5px;
  font-weight: 600;
  cursor: pointer;
}
.activity-feed-link:hover {
  color: var(--c-text);
}
.activity-feed-link.is-accent {
  color: var(--c-purple);
}
.activity-feed-link.is-accent:hover {
  text-decoration: underline;
}

.writers-scrim {
  position: absolute;
  inset: 0;
  background: rgba(4, 10, 18, 0.55);
  z-index: 9999;
}
.writers-sheet {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 400px;
  max-width: calc(100% - 48px);
  background: var(--c-panel);
  border: 1px solid var(--c-line);
  border-radius: 12px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  z-index: 10000;
  overflow: hidden;
}
.writers-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--c-line);
  background: color-mix(in srgb, var(--c-bg) 60%, transparent);
}
.writers-title {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  color: var(--c-text);
}
.writers-board {
  font: 9px var(--mono);
  color: var(--c-dim);
}
.writers-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 14px;
}
.writers-section {
  padding: 8px 0 2px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-dim);
}
.writers-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 0;
}
.writers-name {
  flex: 1;
  font-size: 11.5px;
  color: var(--c-text-soft);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.writers-name.is-mono {
  font: 11px var(--mono);
}
.writers-config {
  font-size: 9.5px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--c-purple) 12%, transparent);
  color: var(--c-purple);
}
.writers-meta {
  font: 9.5px var(--mono);
  color: var(--c-dim);
}
.writers-empty {
  font-size: 10.5px;
  color: var(--c-dim);
  padding: 4px 0;
}
.writers-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-top: 1px solid var(--c-line);
  background: color-mix(in srgb, var(--c-bg) 50%, transparent);
}
.writers-note {
  flex: 1;
  font-size: 10px;
  color: var(--c-dim);
}
.writers-done {
  padding: 5px 14px;
  border: none;
  border-radius: 7px;
  background: var(--c-accent);
  color: var(--c-bg);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

/* ── Minimap v2 (rail-chrome-v2 phase 7, item 19) ─────────────
   True-scale map from the store; magnifies ×1.7 from the bottom-right on hover. */
.minimap {
  position: absolute;
  bottom: 18px;
  right: 16px;
  width: 168px;
  height: 112px;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  background: color-mix(in srgb, var(--c-panel-soft) 94%, transparent);
  backdrop-filter: blur(8px);
  z-index: 60;
  opacity: 0.85;
  transform-origin: bottom right;
  transition:
    transform 160ms ease,
    opacity 120ms ease;
  cursor: crosshair;
  user-select: none;
}
.minimap:hover {
  opacity: 1;
  transform: scale(1.7);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
}
.minimap-node {
  position: absolute;
  border-radius: 1.5px;
  background: var(--kind);
  opacity: 0.55;
}
.minimap-node.is-group {
  background: color-mix(in srgb, var(--kind) 4%, transparent);
  border: 1px dashed color-mix(in srgb, var(--kind) 55%, transparent);
  opacity: 1;
  border-radius: 2px;
}
.minimap-node.is-selected {
  outline: 1px solid var(--c-accent);
  opacity: 0.8;
}
.minimap-fence {
  position: absolute;
  border: 1px dashed color-mix(in srgb, var(--c-purple) 45%, transparent);
  border-radius: 2px;
  background: color-mix(in srgb, var(--c-purple) 3%, transparent);
}
.minimap-presence {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--presence-color);
  border: 1.5px solid var(--c-bg);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--presence-color) 45%, transparent);
  z-index: 4;
}
/* Actively working = the moment the human is looking for: pulse the halo. */
.minimap-presence.phase-thinking,
.minimap-presence.phase-tooling {
  animation: presence-pulse 1.6s ease-in-out infinite;
}
.minimap-presence.is-worker {
  width: 6px;
  height: 6px;
}
.minimap-presence.is-external {
  opacity: 0.75;
}
.minimap-frame {
  position: absolute;
  border: 1.5px solid color-mix(in srgb, var(--c-accent) 85%, transparent);
  border-radius: 2px;
  background: color-mix(in srgb, var(--c-accent) 5%, transparent);
  cursor: grab;
}
.minimap-zoom {
  position: absolute;
  right: 5px;
  bottom: 3px;
  font: 8px var(--mono);
  color: var(--c-dim);
}

/* ── Accessibility sweep (rail-chrome-v2 item 18) ───────────────
   One focus ring for every chrome control; nodes are focusable for the
   keyboard (arrow keys traverse, Enter opens); reduced motion below. */
.tool-rail button:focus-visible,
.top-bar button:focus-visible,
.connection-banner button:focus-visible,
.session-panel button:focus-visible,
.session-panel input:focus-visible,
.command-bar button:focus-visible,
.command-bar-input:focus-visible,
.selection-bar button:focus-visible,
.activity-feed button:focus-visible,
.writers-sheet button:focus-visible,
.empty-state button:focus-visible,
.session-receipt button:focus-visible,
.snapshot-panel button:focus-visible,
.expanded-header button:focus-visible,
.group-action:focus-visible,
.group-menu button:focus-visible,
.command-palette-item:focus-visible,
.canvas-node:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
}
.command-bar-input:focus-visible {
  outline: none;
}
.canvas-node:focus {
  outline: none;
}
.canvas-node:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  .human-cursor {
    transition: none;
  }
  .connection-banner-progress-fill,
  .connection-dot,
  .external-indicator-dot,
  .group-chip-expand,
  .beta-tag {
  margin-left: 2px;
  padding: 1px 5px;
  border-radius: 8px;
  border: 1px solid color-mix(in srgb, var(--c-accent) 45%, transparent);
  color: var(--c-accent);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1.4;
}

.start-session-dot {
    animation: none;
  }
  .command-palette,
  .snapshot-panel,
  .session-receipt,
  .canvas-node.group-node,
  .activity-feed,
  .writers-sheet,
  .context-budget-fill {
    animation: none;
    transition: none;
  }
}

/* ── Edge creation (rail-chrome-v2 item 15) ───────────────────── */
.canvas-node.is-edge-target {
  box-shadow: 0 0 0 2px var(--c-accent), 0 0 0 6px color-mix(in srgb, var(--c-accent) 18%, transparent);
}
.canvas-node.is-edge-target .node-port {
  opacity: 1;
  background: var(--c-accent);
}
.edge-hint-pill {
  position: absolute;
  z-index: 10000;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--c-panel) 96%, transparent);
  border: 1px solid color-mix(in srgb, var(--c-accent) 40%, transparent);
  pointer-events: none;
  white-space: nowrap;
}
.edge-hint-main {
  font-size: 10px;
  font-weight: 600;
  color: var(--c-accent);
}
.edge-hint-keys {
  font: 9px var(--mono);
  color: var(--c-dim);
}

/* ── Human collaborator presence (rail-chrome-v2 phase 8) ─────── */
.human-presence-layer {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
  z-index: 69;
}
.human-cursor {
  position: absolute;
  left: 0;
  top: 0;
  color: var(--c-ok);
  transition: transform 120ms linear;
}
.human-cursor-inner {
  transform-origin: top left;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.human-cursor-tag {
  margin-left: 11px;
  margin-top: -2px;
  padding: 3px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--c-ok) 92%, transparent);
  color: var(--c-bg);
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
}
.human-cursor.is-grabbing .human-cursor-tag::after {
  content: ' · editing';
  font-weight: 500;
  opacity: 0.8;
}
.node-yield-pill {
  /* Inside the card (paint containment clips anything outside it). */
  position: absolute;
  left: 10px;
  bottom: 8px;
  z-index: 5;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--c-panel-soft);
  border: 1px solid color-mix(in srgb, var(--c-warn) 40%, transparent);
  color: var(--c-warn);
  font-size: 9.5px;
  font-weight: 600;
  white-space: nowrap;
}
.node-yield-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--c-warn);
}

/* Quiet-board affordance in the top bar */
.start-session-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1px solid var(--c-line);
  background: none;
  color: var(--c-muted);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.start-session-btn:hover {
  border-color: color-mix(in srgb, var(--c-purple) 40%, transparent);
  color: var(--c-purple);
}
.start-session-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c-dim);
}
.start-session-btn:hover .start-session-dot {
  background: var(--c-purple);
}
.session-end {
  padding: 3px 10px;
  border-radius: 6px;
  border: 1px solid var(--c-line);
  background: none;
  color: var(--c-muted);
  font-size: 10.5px;
  font-weight: 600;
  cursor: pointer;
}
.session-end:hover {
  border-color: color-mix(in srgb, var(--c-danger) 45%, transparent);
  color: var(--c-danger);
}

/* Session receipt (design item 2) */
.session-receipt {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 290px;
  z-index: 9998;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--c-line);
  background: color-mix(in srgb, var(--c-panel) 96%, transparent);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  animation: session-panel-in 180ms ease;
}
.session-receipt-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.session-receipt-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c-dim);
}
.session-receipt-title {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  color: var(--c-text);
}
.session-receipt-close {
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--c-muted);
  font-size: 14px;
  cursor: pointer;
}
.session-receipt-close:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
}
.session-receipt-tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.session-receipt-tile {
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--c-line);
  background: color-mix(in srgb, var(--c-panel-soft) 70%, transparent);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.session-receipt-tile-label {
  font-size: 9.5px;
  color: var(--c-dim);
}
.session-receipt-tile-value {
  font-size: 15px;
  font-weight: 700;
  color: var(--c-text);
}
.session-receipt-tile-value.tone-ok {
  color: var(--c-ok);
}
.session-receipt-tile-value.tone-danger {
  color: var(--c-danger);
}
.session-receipt-note,
.session-receipt-diff {
  margin-top: 10px;
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--c-muted);
}
.session-receipt-diff {
  color: var(--c-text-soft);
}
.session-receipt-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.session-receipt-primary,
.session-receipt-secondary {
  flex: 1;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}
.session-receipt-primary {
  border: 1px solid var(--c-accent-25);
  background: var(--c-accent-12);
  color: var(--c-accent);
}
.session-receipt-primary:disabled {
  opacity: 0.5;
  cursor: default;
}
.session-receipt-secondary {
  border: 1px solid var(--c-line);
  background: none;
  color: var(--c-muted);
}
.session-receipt-secondary:hover {
  color: var(--c-text);
}

/* Top-bar escalation badge while gates are pending */
.gate-badge {
  display: inline-flex;
  align-items: center;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--c-warn) 35%, transparent);
  background: color-mix(in srgb, var(--c-warn) 12%, transparent);
  color: var(--c-warn);
  font: 11px var(--mono);
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

@keyframes session-panel-in {
  from {
    opacity: 0;
    transform: translateX(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* Below 1180px the panel floats over the canvas as a drawer (design item 12). */
@media (max-width: 1180px) {
  .session-panel:not(.is-collapsed) {
    position: fixed;
    top: var(--hud-bar-height);
    right: 0;
    bottom: 0;
    width: 312px;
    box-shadow: -16px 0 40px rgba(0, 0, 0, 0.5);
  }
}

@media (prefers-reduced-motion: reduce) {
  .session-panel {
    animation: none;
  }
  .session-live-dot,
  .session-item.status-running .session-glyph,
  .external-indicator-dot,
  .minimap-presence {
    animation: none;
  }
  .minimap {
    transition: none;
  }
}

/* Pan tool / held Space: the world layer goes pointer-inert so drags land on
   the viewport container itself and pan — nodes cannot swallow the drag.
   user-select too: text selection sweeps straight through pointer-inert
   content, and a selection made mid-pan later becomes a native text drag the
   drop handler mints webpage nodes from (0.5.1 Amp finding D). */
.canvas-viewport.pan-mode .canvas-world {
  pointer-events: none;
  -webkit-user-select: none;
  user-select: none;
}
/* The resize handle and connect ports carry their own pointer-events: auto,
   which punches through the inert world — a pan started on them never pans. */
.canvas-viewport.pan-mode .node-resize-handle,
.canvas-viewport.pan-mode .node-port {
  pointer-events: none;
}
.canvas-viewport.pan-mode:active {
  cursor: grabbing;
}

.toolbar-tooltip-anchor {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.toolbar-tooltip-anchor-start .toolbar-tooltip {
  left: 0;
  transform: translateX(0) translateY(6px);
}

.toolbar-tooltip-anchor-end .toolbar-tooltip {
  left: auto;
  right: 0;
  transform: translateX(0) translateY(6px);
}

.toolbar-tooltip {
  position: absolute;
  left: 50%;
  top: calc(100% + 10px);
  transform: translateX(-50%) translateY(6px);
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 168px;
  max-width: 240px;
  padding: 10px 12px;
  background: color-mix(in srgb, var(--c-panel) 92%, black 8%);
  border: 1px solid color-mix(in srgb, var(--c-line) 78%, var(--c-accent) 22%);
  border-radius: 10px;
  box-shadow: 0 14px 36px var(--c-shadow-heavy), 0 0 0 1px var(--c-accent-8);
  backdrop-filter: blur(14px);
  color: var(--c-text);
  font-size: 12px;
  line-height: 1.35;
  white-space: normal;
  opacity: 0;
  pointer-events: none;
  z-index: 10010;
  transition: opacity 0.14s ease, transform 0.14s ease;
}

.toolbar-tooltip::after {
  content: '';
  position: absolute;
  left: 50%;
  top: -5px;
  width: 10px;
  height: 10px;
  background: inherit;
  border-top: 1px solid color-mix(in srgb, var(--c-line) 78%, var(--c-accent) 22%);
  border-left: 1px solid color-mix(in srgb, var(--c-line) 78%, var(--c-accent) 22%);
  transform: translateX(-50%) rotate(45deg);
}

.toolbar-tooltip-anchor-start .toolbar-tooltip::after {
  left: 18px;
  transform: rotate(45deg);
}

.toolbar-tooltip-anchor-end .toolbar-tooltip::after {
  left: auto;
  right: 18px;
  transform: rotate(45deg);
}

/* Up variant: bottom-anchored bars (selection bar) open their tooltip above. */
.toolbar-tooltip-anchor-up .toolbar-tooltip {
  top: auto;
  bottom: calc(100% + 10px);
  transform: translateX(-50%) translateY(-6px);
}
.toolbar-tooltip-anchor-up .toolbar-tooltip::after {
  top: auto;
  bottom: -5px;
  border-top: none;
  border-left: none;
  border-bottom: 1px solid color-mix(in srgb, var(--c-line) 78%, var(--c-accent) 22%);
  border-right: 1px solid color-mix(in srgb, var(--c-line) 78%, var(--c-accent) 22%);
}
.toolbar-tooltip-anchor-up:hover .toolbar-tooltip,
.toolbar-tooltip-anchor-up > :focus-visible + .toolbar-tooltip {
  transform: translateX(-50%) translateY(0);
}

/* :focus-within opens the tooltip only on tap-to-open (informational)
   anchors — an action button's tooltip must dismiss after its click. */
.toolbar-tooltip-anchor:hover .toolbar-tooltip,
.toolbar-tooltip-anchor-tap:focus-within .toolbar-tooltip,
.toolbar-tooltip-anchor > :focus-visible + .toolbar-tooltip {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toolbar-tooltip-anchor-start:hover .toolbar-tooltip,
.toolbar-tooltip-anchor-start.toolbar-tooltip-anchor-tap:focus-within .toolbar-tooltip,
.toolbar-tooltip-anchor-start > :focus-visible + .toolbar-tooltip,
.toolbar-tooltip-anchor-end:hover .toolbar-tooltip,
.toolbar-tooltip-anchor-end.toolbar-tooltip-anchor-tap:focus-within .toolbar-tooltip,
.toolbar-tooltip-anchor-end > :focus-visible + .toolbar-tooltip {
  transform: translateX(0) translateY(0);
}

.toolbar-tooltip-anchor {
  outline: none;
}

/* Rail variant: fixed beside the hovered button (the rail's scroll clip would
   swallow an absolute one), arrow on the left, mounted only while hovered. */
.toolbar-tooltip.rail-tooltip {
  position: fixed;
  right: auto;
  bottom: auto;
  min-width: 0;
  opacity: 1;
  transform: translateY(-50%);
  animation: rail-tooltip-in 0.14s ease both;
}
.toolbar-tooltip.rail-tooltip::after {
  left: -5px;
  top: 50%;
  border-top: none;
  border-right: none;
  border-bottom: 1px solid color-mix(in srgb, var(--c-line) 78%, var(--c-accent) 22%);
  border-left: 1px solid color-mix(in srgb, var(--c-line) 78%, var(--c-accent) 22%);
  transform: translateY(-50%) rotate(45deg);
}
@keyframes rail-tooltip-in {
  from {
    opacity: 0;
    transform: translateY(-50%) translateX(-4px);
  }
  to {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }
}

.toolbar-tooltip-body {
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--c-text-soft);
}

.toolbar-tooltip-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--c-text);
}

.toolbar-tooltip-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--c-text-soft);
}

.toolbar-tooltip-shortcut {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 20px;
  padding: 2px 7px;
  border-radius: 999px;
  border: 1px solid var(--c-accent-25);
  background: var(--c-accent-10);
  color: var(--c-accent);
  font: 11px/1 var(--mono);
  white-space: nowrap;
}

.connection-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.connection-dot.connected {
  background: var(--c-ok);
}
.connection-dot.connecting {
  background: var(--c-warn);
  animation: pulse 1.5s infinite;
}
.connection-dot.disconnected {
  background: var(--c-danger);
}
.connection-dot.reconnecting {
  background: var(--c-warn);
  animation: pulse 1.5s infinite;
}
.connection-dot.resyncing {
  background: var(--c-accent);
  animation: pulse 1.5s infinite;
}

/* Degraded-connection banner under the top bar (phase 7, item 14) */
.connection-banner {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 14px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--c-line);
  font-size: 11.5px;
}
.connection-banner.is-reconnecting {
  background: color-mix(in srgb, var(--c-warn) 10%, transparent);
  border-bottom-color: color-mix(in srgb, var(--c-warn) 35%, transparent);
  color: var(--c-warn);
}
.connection-banner.is-resyncing {
  background: color-mix(in srgb, var(--c-accent) 8%, transparent);
  border-bottom-color: color-mix(in srgb, var(--c-accent) 30%, transparent);
  color: var(--c-accent);
}
.connection-banner-glyph {
  font-size: 13px;
  line-height: 1;
}
.connection-banner-text {
  flex: 1;
  min-width: 0;
}
.connection-banner-meta {
  font: 9.5px var(--mono);
  color: var(--c-muted);
}
.connection-banner-progress {
  width: 90px;
  height: 4px;
  border-radius: 2px;
  background: var(--c-line);
  overflow: hidden;
}
.connection-banner-progress-fill {
  display: block;
  width: 40%;
  height: 100%;
  background: var(--c-accent);
  animation: connection-resync 1.1s ease-in-out infinite;
}
@keyframes connection-resync {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(260%);
  }
}

@keyframes pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.4;
  }
}


/* Positioning parent for a toolbar popover menu. Every menu MUST live inside
   one of these wrapped around its trigger — anchoring to a wider ancestor
   opens the menu far from the button (0.4.2 report Finding T). */
.toolbar-menu-anchor {
  position: relative;
  display: inline-flex;
}


/* ── Toolbar popover menus (theme picker + narrow-screen More menu) ── */
.toolbar-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  /* Above the annotation capture layer (9996) — rail popovers overlap the
     canvas region and must stay clickable while an annotation tool is armed. */
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 224px;
  max-height: min(70vh, 560px);
  overflow-y: auto;
  padding: 6px;
  background: var(--c-panel-glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--c-line);
  border-radius: var(--radius);
  box-shadow: 0 18px 48px var(--c-shadow-heavy);
}

.toolbar-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 40px;
  padding: 8px 12px;
  background: none;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--c-text-soft);
  font: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
}

.toolbar-menu-item:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
  border-color: var(--c-line);
}

.toolbar-menu-item.active {
  color: var(--c-accent);
}

.toolbar-menu-item svg {
  flex-shrink: 0;
}

.toolbar-menu-check {
  margin-left: auto;
  color: var(--c-accent);
}

.toolbar-menu-separator {
  height: 1px;
  margin: 4px 8px;
  background: var(--c-line);
  flex-shrink: 0;
}

.toolbar-menu-heading {
  padding: 6px 12px 2px;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--c-dim);
}

.theme-swatch {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border: 1px solid var(--c-line);
  border-radius: 50%;
  flex-shrink: 0;
}

.theme-swatch-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}


@media (max-width: 900px) {
  .toolbar-tooltip {
    min-width: 150px;
    max-width: 200px;
    padding: 9px 10px;
    font-size: 11px;
  }

  .toolbar-tooltip-label {
    font-size: 12px;
  }

  .toolbar-tooltip-meta {
    gap: 8px;
  }
}

/* Below 1180px the top bar drops its low-value meta text (board id, counts).
   Buttons keep their aria-labels + tooltips, so nothing is lost for a11y or
   discovery. */
@media (max-width: 1180px) {
  .hud-collapsible-text {
    display: none;
  }
}

/* Raw markdown source editor */
.md-editor-split {
  display: flex;
  height: 100%;
  gap: 1px;
  background: var(--c-line);
}

.md-editor-split textarea {
  flex: 1;
  resize: none;
  border: none;
  background: var(--c-panel-soft);
  color: var(--c-text);
  font: 13px / 1.6 var(--mono);
  padding: 12px;
  outline: none;
}

.md-editor-split .md-preview {
  flex: 1;
  overflow: auto;
  padding: 12px;
  background: var(--c-panel);
}

/* ── Expanded editor layout ────────────────────────────────── */
.md-editor-expanded {
  display: flex;
  flex-direction: column;
  height: 100%;
}

.md-editor-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  border-bottom: 1px solid var(--c-line);
  background: var(--c-panel-overlay);
  flex-shrink: 0;
}

.md-toolbar-btn {
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 500;
  background: var(--c-surface-hover);
  border: 1px solid var(--c-line);
  border-radius: var(--radius-sm);
  color: var(--c-muted);
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.12s ease;
}

.md-toolbar-btn:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
  border-color: var(--c-muted);
}

.md-toolbar-btn-primary {
  background: var(--c-accent-15);
  border-color: var(--c-accent-40);
  color: var(--c-accent);
}

.md-toolbar-btn-primary:hover {
  background: var(--c-accent-25);
  border-color: var(--c-accent);
}

.md-toolbar-btn:disabled {
  opacity: 0.5;
  cursor: default;
}

.md-toolbar-path {
  font-size: 11px;
  color: var(--c-muted);
}

.md-editor-expanded .md-editor-split {
  flex: 1;
  min-height: 0;
}

/* ── Markdown reader mode (expanded view) ──────────────────── */
.md-reader {
  height: 100%;
  overflow-y: auto;
  display: flex;
  justify-content: center;
}

.md-reader-content {
  max-width: 760px;
  width: 100%;
  padding: 8px 24px 48px;
  font-size: 15px;
  line-height: 1.75;
  color: var(--c-text);
}

.md-reader-content h1 {
  font-size: 1.7em;
  margin: 1em 0 0.5em;
  padding-bottom: 0.3em;
  border-bottom: 1px solid var(--c-line);
  color: var(--c-text);
  font-weight: 700;
}

.md-reader-content h2 {
  font-size: 1.35em;
  margin: 0.9em 0 0.4em;
  color: var(--c-text);
  font-weight: 600;
}

.md-reader-content h3 {
  font-size: 1.1em;
  margin: 0.7em 0 0.3em;
  color: var(--c-text);
  font-weight: 600;
}

.md-reader-content p {
  margin: 0.6em 0;
  color: var(--c-text);
}

.md-reader-content ul,
.md-reader-content ol {
  margin: 0.5em 0;
  padding-left: 1.5em;
  color: var(--c-text);
}

.md-reader-content li {
  margin: 0.25em 0;
}

.md-reader-content li::marker {
  color: var(--c-muted);
}

.md-reader-content blockquote {
  border-left: 3px solid var(--c-accent);
  padding: 0.5em 1em;
  margin: 0.8em 0;
  background: var(--c-accent-8);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.md-reader-content blockquote p {
  color: var(--c-muted);
}

.md-reader-content strong {
  color: var(--c-text);
  font-weight: 600;
}

.md-reader-content a {
  color: var(--c-accent);
  text-decoration: none;
}

.md-reader-content a:hover {
  text-decoration: underline;
}

.md-reader-content code {
  font-family: var(--mono);
  font-size: 0.88em;
  background: var(--c-surface-hover);
  padding: 2px 6px;
  border-radius: 4px;
}

.md-reader-content pre {
  background: var(--c-shadow);
  padding: 14px 16px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 0.8em 0;
  border: 1px solid var(--c-line-30);
}

.md-reader-content pre code {
  background: none;
  padding: 0;
}

.md-reader-content hr {
  border: none;
  border-top: 1px solid var(--c-line);
  margin: 1.5em 0;
}

/* Reader-mode tables — polished with rounded container */
.md-reader-content table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border: 1px solid var(--c-line);
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin: 1em 0;
}

.md-reader-content th {
  background: var(--c-accent-8);
  font-weight: 600;
  color: var(--c-text);
  padding: 10px 14px;
  border-bottom: 2px solid var(--c-line);
  text-align: left;
  font-size: 0.85em;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.md-reader-content td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--c-line-30);
  color: var(--c-text);
}

.md-reader-content th + th,
.md-reader-content td + td {
  border-left: 1px solid var(--c-line-30);
}

.md-reader-content tr:last-child td {
  border-bottom: none;
}

.md-reader-content tbody tr:hover td {
  background: var(--c-surface-subtle);
}

/* Source-mode FAB in expanded document view */
.md-edit-fab {
  position: absolute;
  bottom: 16px;
  right: 16px;
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  background: var(--c-panel-glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--c-line);
  border-radius: var(--radius);
  color: var(--c-muted);
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.15s ease;
  z-index: 1;
  box-shadow: 0 4px 16px var(--c-shadow);
}

.md-edit-fab:hover {
  background: var(--c-accent-12);
  border-color: var(--c-accent);
  color: var(--c-accent);
  box-shadow: 0 4px 20px var(--c-glow-accent);
}

/* ── Inline WYSIWYG editor (contentEditable on the rendered HTML) ─
   The .md-reader-content styles above already give us the reading
   typography; we just need to strip the browser's contentEditable chrome
   and make the caret visible. */
.md-reader-editable {
  outline: none;
  caret-color: var(--c-accent);
  cursor: text;
}

.md-reader-editable:focus {
  outline: none;
}

.md-reader-editable::selection,
.md-reader-editable *::selection {
  background: var(--c-accent-25);
}

/* ── Inline selection toolbar (contentEditable WYSIWYG) ────────── */
.md-inline-format-bar {
  position: fixed;
  z-index: 10002; /* above the expanded overlay (z-index 10001) */
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px 6px;
  background: var(--c-panel-glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--c-line);
  border-radius: 8px;
  box-shadow: 0 4px 16px var(--c-shadow), 0 0 0 1px var(--c-line-30);
  font-family: var(--font);
  animation: md-inline-format-bar-in 0.1s ease-out;
}

@keyframes md-inline-format-bar-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.md-inline-format-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  padding: 0 7px;
  background: none;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font: 600 12px var(--font);
  color: var(--c-text-soft);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
}

.md-inline-format-btn:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
  border-color: var(--c-line);
}

.md-inline-format-btn:active {
  background: var(--c-accent-12);
  color: var(--c-accent);
}

.md-inline-format-divider {
  width: 1px;
  height: 18px;
  background: var(--c-line);
  margin: 0 3px;
  flex-shrink: 0;
}

/* ── Markdown Format Bar (floating) ─────────────────────────── */
.md-format-bar {
  position: fixed;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px 6px;
  background: var(--c-panel-glass);
  backdrop-filter: blur(16px);
  border: 1px solid var(--c-line);
  border-radius: 8px;
  box-shadow: 0 4px 16px var(--c-shadow), 0 0 0 1px var(--c-line-30);
  animation: md-format-bar-in 0.12s ease-out;
}

@keyframes md-format-bar-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

.md-format-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  height: 26px;
  padding: 0 5px;
  background: none;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--c-muted);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
}

.md-format-btn:hover {
  background: var(--c-surface-hover);
  color: var(--c-text);
  border-color: var(--c-line);
}

.md-format-btn:active {
  background: var(--c-accent-12);
  color: var(--c-accent);
}

.md-format-btn-bold { font-weight: 800; }
.md-format-btn-italic { font-style: italic; }
.md-format-btn-strike { text-decoration: line-through; }

.md-format-divider {
  width: 1px;
  height: 18px;
  background: var(--c-line);
  margin: 0 3px;
  flex-shrink: 0;
}

/* Auto-fit transition */
.canvas-node {
  transition: height 0.2s ease, box-shadow 0.15s ease;
}

/* Node resize handle */
.canvas-node:has(.node-resize-handle) {
  /* Keep the four-pixel corner grab inside the shell's inner clip, not on
     its rounded border. The other corners retain the standard card radius. */
  border-bottom-right-radius: 8px;
}

.canvas-node .node-resize-handle {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 32px;
  height: 32px;
  background: rgba(0, 0, 0, 0.001);
  cursor: nwse-resize;
  z-index: 30;
  pointer-events: auto;
  touch-action: none;
}
